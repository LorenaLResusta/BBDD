<title id="t">Torneo de Quidditch: jugadores especializados</title><desc id="d">JUGADOR se especializa (d, total) en GUARDIÁN, GOLPEADOR, CAZADOR y BUSCADOR. EQUIPO tiene JUGADOR y capitán, juega PARTIDO como local y visitante. ÁRBITRO arbitra PARTIDO. PARTIDO registra INCIDENCIA.</desc>
