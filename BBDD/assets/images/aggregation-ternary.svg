<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="t">Agregación y relación ternaria</title><desc id="d">A la izquierda, MATRIMONIO como agregación relacionada con JUZGADO; a la derecha, la ternaria PROFESOR–ASIGNATURA–GRUPO.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<style>.hot{cursor:pointer;transition:filter .15s}.hot:hover,.hot:focus,.hot.on{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.35));outline:none}</style>
<rect width="880" height="540" rx="12" fill="url(#bg)"/>
<text x="440.0" y="40.0" font-size="21" fill="#f1f5f9" text-anchor="middle" font-weight="700">Agregación y relación ternaria</text>
<rect x="24.0" y="66.0" width="420.0" height="440.0" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
<text x="234.0" y="94.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="700">1. Agregación</text>
