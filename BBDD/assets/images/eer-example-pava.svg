<title id="t">Diagrama EER de la empresa de repostería PAVA S.A.</title><desc id="d">CLIENTE realiza PEDIDO, que incluye FORMATO_PRODUCTO; PRODUCTO se compone de INGREDIENTE y compite con COMPETIDOR.</desc>
