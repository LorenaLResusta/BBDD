<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="850" height="420" rx="12" fill="url(#bgAccess)"/>
  <text x="425" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Métodos de Organización y Acceso a Archivos</text>

  <!-- 1. Secuencial -->
  <g transform="translate(40, 60)">
    <rect width="770" height="95" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="28" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">1. Acceso Secuencial (ej. Cintas Magnéticas)</text>
    <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Para leer el Registro 4, hay que leer obligatoriamente Reg 1, Reg 2 y Reg 3.</text>
    
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="100" height="28" rx="4" fill="#3b82f6"/>
      <text x="50" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Registro 1</text>

      <rect x="110" y="0" width="100" height="28" rx="4" fill="#3b82f6"/>
      <text x="160" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Registro 2</text>

      <rect x="220" y="0" width="100" height="28" rx="4" fill="#3b82f6"/>
      <text x="270" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Registro 3</text>

      <rect x="330" y="0" width="100" height="28" rx="4" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <text x="380" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Registro 4 [Deseado]</text>

      <path d="M 50 -5 Q 160 -20 380 -5" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4"/>
      <text x="500" y="18" fill="#ef4444" font-size="11" font-weight="bold">← Recorrido paso a paso (Lento)</text>
    </g>
  </g>

  <!-- 2. Aleatorio/Directo -->
  <g transform="translate(40, 175)">
    <rect width="770" height="105" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">2. Acceso Aleatorio / Directo (ej. Discos Duros - Registros de Longitud Fija L)</text>
    <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cálculo directo del desplazamiento (offset): Posición = N × L. Acceso inmediato.</text>

    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="130" height="30" rx="4" fill="#334155"/>
      <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11">Reg 0 (Bytes 0..229)</text>

      <rect x="140" y="0" width="130" height="30" rx="4" fill="#334155"/>
      <text x="205" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11">Reg 1 (Bytes 230..459)</text>

      <rect x="280" y="0" width="160" height="30" rx="4" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <text x="360" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Reg N (Byte Offset = N×230)</text>

      <text x="460" y="20" fill="#34d399" font-size="12" font-weight="bold">⚡ Ejemplo: Reg 10 → Byte 2300 directo!</text>
    </g>
  </g>

  <!-- 3. Indexado -->
  <g transform="translate(40, 295)">
    <rect width="770" height="105" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="28" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">3. Acceso Indexado (Uso de Índices / Árboles B)</text>
    <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Un índice mantiene pares (Clave → Puntero a Disco). Permite búsquedas rápidas en ficheros variables.</text>

    <g transform="translate(20, 58)">
      <!-- Index block -->
      <rect x="0" y="0" width="140" height="32" rx="4" fill="#8b5cf6"/>
      <text x="70" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Índice: ID 25 → Ptr #402</text>

      <!-- Arrow -->
      <path d="M 145 16 L 235 16" stroke="#a78bfa" stroke-width="3" fill="none"/>

      <!-- Data block -->
      <rect x="240" y="0" width="220" height="32" rx="4" fill="#334155" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="350" y="20" text-anchor="middle" fill="#fff" font-size="11">Bloque de Datos #402 en Disco</text>
    </g>
  </g>
</svg>