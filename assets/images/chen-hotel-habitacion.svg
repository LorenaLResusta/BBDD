  <g fill="none" stroke="#38bdf8" stroke-width="2"><rect x="635" y="115" width="180" height="54"/><rect x="641" y="121" width="168" height="42"/></g>
  <g fill="#047857" stroke="#34d399" stroke-width="2"><polygon points="450,91 545,142 450,193 355,142"/><polygon points="450,100 528,142 450,184 372,142"/></g>
  <g fill="#312e81" stroke="#a5b4fc" stroke-width="2"><ellipse cx="120" cy="47" rx="75" ry="25"/><ellipse cx="210" cy="310" rx="68" ry="25"/><ellipse cx="780" cy="47" rx="81" ry="25"/><ellipse cx="675" cy="310" rx="66" ry="25"/><ellipse cx="835" cy="310" rx="81" ry="25"/></g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle"><text x="180" y="148" font-size="16" font-weight="700">HOTEL</text><text x="725" y="148" font-size="16" font-weight="700">HABITACION</text><text x="450" y="147" font-size="14" font-weight="700">CONTIENE</text><text x="120" y="52" font-size="12" text-decoration="underline">id_hotel (PK)</text><text x="210" y="315" font-size="14">nombre</text><text x="780" y="52" font-size="12" text-decoration="underline" stroke-dasharray="3 2">num_habitacion (parcial)</text><text x="675" y="315" font-size="14">capacidad</text><text x="835" y="315" font-size="13">precio_noche</text><text x="310" y="130" font-size="14" font-weight="700">1</text><text x="590" y="130" font-size="14" font-weight="700">N</text></g>
