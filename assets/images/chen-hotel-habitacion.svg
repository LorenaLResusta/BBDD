<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">HOTEL y entidad débil HABITACION en notación Chen</title>
  <desc id="desc">HOTEL identifica sus habitaciones mediante una relación identificadora doble; HABITACION se representa con doble rectángulo y número parcial.</desc>
  <rect width="1000" height="350" fill="#0f172a"/>
