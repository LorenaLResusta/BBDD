<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">CLIENTE realiza PEDIDO, diagrama E-R de Chen</title>
  <desc id="desc">CLIENTE y PEDIDO son entidades rectangulares unidas por el rombo REALIZA. Los atributos aparecen en óvalos; la cardinalidad es uno a muchos.</desc>
  <rect width="900" height="320" fill="#0f172a"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M260 132H365M535 132H640"/>
    <path d="M170 106L125 55M190 158L140 247M225 158L252 247M710 106L750 55M685 158L655 247M742 158L785 247"/>
  </g>
  <g fill="#075985" stroke="#38bdf8" stroke-width="2">
    <rect x="90" y="105" width="170" height="54"/><rect x="640" y="105" width="170" height="54"/>
  </g>
  <g fill="#047857" stroke="#34d399" stroke-width="2"><polygon points="450,85 535,132 450,179 365,132"/></g>
  <g fill="#312e81" stroke="#a5b4fc" stroke-width="2">
    <ellipse cx="125" cy="48" rx="76" ry="26"/><ellipse cx="115" cy="267" rx="78" ry="26"/><ellipse cx="270" cy="267" rx="69" ry="26"/>
    <ellipse cx="750" cy="48" rx="78" ry="26"/><ellipse cx="650" cy="267" rx="78" ry="26"/><ellipse cx="795" cy="267" rx="70" ry="26"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="175" y="138" font-size="17" font-weight="700">CLIENTE</text><text x="725" y="138" font-size="17" font-weight="700">PEDIDO</text>
    <text x="450" y="137" font-size="16" font-weight="700">REALIZA</text>
    <text x="125" y="53" font-size="13" text-decoration="underline">id_cliente (PK)</text><text x="115" y="272" font-size="14">nombre</text><text x="270" y="272" font-size="14">email</text>
    <text x="750" y="53" font-size="13" text-decoration="underline">num_pedido (PK)</text><text x="650" y="272" font-size="14">fecha_pedido</text><text x="795" y="272" font-size="14">importe</text>
    <text x="305" y="122" font-size="14" font-weight="700">1</text><text x="590" y="122" font-size="14" font-weight="700">N</text>
  </g>
</svg>