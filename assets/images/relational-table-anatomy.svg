<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="850" height="440" rx="12" fill="url(#bgAnat)"/>
  <text x="425" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Anatomía de una Relación (Tabla) en el Modelo Relacional</text>

  <!-- Table Container -->
  <g transform="translate(50, 65)">
    <rect width="520" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Table Header (Title) -->
    <rect x="0" y="0" width="520" height="40" rx="8" fill="#0284c7"/>
    <text x="260" y="26" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Tabla / Relación: EMPLEADO</text>

    <!-- Attributes Header -->
    <rect x="10" y="50" width="500" height="35" fill="#334155"/>
    <text x="65" y="73" fill="#38bdf8" font-size="12" font-weight="bold">id_emp (PK)</text>
    <text x="180" y="73" fill="#fff" font-size="12" font-weight="bold">nombre</text>
    <text x="300" y="73" fill="#fff" font-size="12" font-weight="bold">salario</text>
    <text x="420" y="73" fill="#f59e0b" font-size="12" font-weight="bold">id_dep (FK)</text>

    <!-- Row 1 -->
    <rect x="10" y="90" width="500" height="35" fill="#0f172a"/>
    <text x="65" y="113" fill="#38bdf8" font-size="12">101</text>
    <text x="180" y="113" fill="#e2e8f0" font-size="12">Ana Torres</text>
    <text x="300" y="113" fill="#e2e8f0" font-size="12">2400.00</text>
    <text x="420" y="113" fill="#f59e0b" font-size="12" font-weight="bold">10</text>

    <!-- Row 2 -->
    <rect x="10" y="130" width="500" height="35" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="65" y="153" fill="#38bdf8" font-size="12">102</text>
    <text x="180" y="153" fill="#e2e8f0" font-size="12">Carlos Ruiz</text>
    <text x="300" y="153" fill="#e2e8f0" font-size="12">1950.00</text>
    <text x="420" y="153" fill="#f59e0b" font-size="12" font-weight="bold">20</text>

    <!-- Row 3 -->
    <rect x="10" y="170" width="500" height="35" fill="#0f172a"/>
    <text x="65" y="193" fill="#38bdf8" font-size="12">103</text>
    <text x="180" y="193" fill="#e2e8f0" font-size="12">Lucía Vega</text>
    <text x="300" y="193" fill="#e2e8f0" font-size="12">3100.00</text>
    <text x="420" y="193" fill="#f59e0b" font-size="12" font-weight="bold">10</text>

    <!-- Row 4 -->
    <rect x="10" y="210" width="500" height="35" fill="#1e293b"/>
    <text x="65" y="233" fill="#38bdf8" font-size="12">104</text>
    <text x="180" y="233" fill="#e2e8f0" font-size="12">David Sanz</text>
    <text x="300" y="233" fill="#e2e8f0" font-size="12">2100.00</text>
    <text x="420" y="233" fill="#f59e0b" font-size="12" font-weight="bold">30</text>
  </g>

  <!-- Explanatory Pointers -->
  <!-- Column / Attribute Pointer -->
  <path d="M 230 50 L 230 20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="70" width="210" height="55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="705" y="92" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">Atributo / Campo</text>
  <text x="705" y="112" text-anchor="middle" fill="#cbd5e1" font-size="11">Grado = 4 Columnas</text>

  <!-- Row / Tuple Pointer -->
  <path d="M 530 210 L 600 210" stroke="#10b981" stroke-width="2"/>
  <rect x="600" y="180" width="210" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="705" y="202" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">Tupla / Fila / Registro</text>
  <text x="705" y="222" text-anchor="middle" fill="#cbd5e1" font-size="11">Cardinalidad = 4 Filas</text>

  <!-- FK Pointer -->
  <rect x="600" y="290" width="210" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="705" y="312" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">Clave Foránea (FK)</text>
  <text x="705" y="332" text-anchor="middle" fill="#cbd5e1" font-size="11">Referencia a DEPARTAMENTO</text>

  <text x="425" y="395" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Grado = Número de Atributos (4). Cardinalidad = Número de Tuplas (4).</text>
</svg>