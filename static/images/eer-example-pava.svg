<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" rx="12" fill="url(#bgPava)"/>
  <text x="450" y="32" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Diagrama EER Completo: Empresa de Repostería "PAVA S.A."</text>

  <!-- Entities -->
  <!-- CLIENTE -->
  <rect x="40" y="60" width="110" height="40" rx="4" fill="#0284c7"/>
  <text x="95" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">CLIENTE</text>

  <polygon points="210,60 235,80 210,100 185,80" fill="#0369a1"/>
  <text x="210" y="84" text-anchor="middle" fill="#fff" font-size="9">REALIZA</text>

  <line x1="150" y1="80" x2="185" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="235" y1="80" x2="280" y2="80" stroke="#38bdf8" stroke-width="2"/>

  <!-- PEDIDO -->
  <rect x="280" y="60" width="110" height="40" rx="4" fill="#0284c7"/>
  <text x="335" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">PEDIDO</text>

  <polygon points="450,60 475,80 450,100 425,80" fill="#0369a1"/>
  <text x="450" y="84" text-anchor="middle" fill="#fff" font-size="9">INCLUYE</text>

  <line x1="390" y1="80" x2="425" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="475" y1="80" x2="520" y2="80" stroke="#38bdf8" stroke-width="2"/>

  <!-- FORMATO_PRODUCTO -->
  <rect x="520" y="60" width="150" height="40" rx="4" fill="#047857"/>
  <text x="595" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">FORMATO_PRODUCTO</text>

  <!-- PRODUCTO -->
  <line x1="595" y1="100" x2="595" y2="150" stroke="#10b981" stroke-width="2"/>
  <rect x="520" y="150" width="150" height="40" rx="4" fill="#047857"/>
  <text x="595" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">PRODUCTO</text>

  <!-- INGREDIENTE -->
  <polygon points="450,150 475,170 450,190 425,170" fill="#059669"/>
  <text x="450" y="174" text-anchor="middle" fill="#fff" font-size="9">COMPUESTO</text>
  <line x1="520" y1="170" x2="475" y2="170" stroke="#10b981" stroke-width="2"/>
  <line x1="425" y1="170" x2="380" y2="170" stroke="#10b981" stroke-width="2"/>

  <rect x="250" y="150" width="130" height="40" rx="4" fill="#047857"/>
  <text x="315" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">INGREDIENTE</text>

  <!-- PROMOCIONES -->
  <rect x="720" y="60" width="130" height="40" rx="4" fill="#6d28d9"/>
  <text x="785" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">PROMOCIÓN</text>
  <line x1="670" y1="80" x2="720" y2="80" stroke="#a78bfa" stroke-width="2"/>

  <!-- COMPETIDORES -->
  <rect x="520" y="260" width="150" height="40" rx="4" fill="#b91c1c"/>
  <text x="595" y="284" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">COMPETIDOR</text>
  <polygon points="595,210 615,230 595,250 575,230" fill="#991b1b"/>
  <text x="595" y="234" text-anchor="middle" fill="#fff" font-size="8">SIMILAR A</text>
  <line x1="595" y1="190" x2="595" y2="210" stroke="#ef4444" stroke-width="2"/>
  <line x1="595" y1="250" x2="595" y2="260" stroke="#ef4444" stroke-width="2"/>

  <!-- Explanatory note -->
  <rect x="40" y="340" width="820" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="365" fill="#38bdf8" font-size="13" font-weight="bold">Aspectos Clave del Modelo PAVA S.A.:</text>
  <text x="60" y="388" fill="#e2e8f0" font-size="11">• <tspan font-weight="bold">Composición:</tspan> Relación M:N entre PRODUCTO e INGREDIENTE indicando el porcentaje de participación.</text>
  <text x="60" y="408" fill="#e2e8f0" font-size="11">• <tspan font-weight="bold">Formatos:</tspan> PRODUCTO se comercializa en distintos FORMATO_PRODUCTO (peso en gramos y precio específico).</text>
  <text x="60" y="428" fill="#e2e8f0" font-size="11">• <tspan font-weight="bold">Competencia:</tspan> Relación reflexiva o directa entre PRODUCTO y sus COMPETIDORES de marcas rivales.</text>
</svg>