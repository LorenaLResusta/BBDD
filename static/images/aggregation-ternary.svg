<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="850" height="420" rx="12" fill="url(#bgAgg)"/>
  <text x="425" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Mecanismos Avanzados: Agregación y Relación Ternaria</text>

  <!-- Left: Aggregation -->
  <g transform="translate(30, 65)">
    <rect width="380" height="320" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="190" y="28" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">1. Agregación (Asociación como Entidad)</text>

    <!-- Outer Aggregated Box -->
    <rect x="25" y="50" width="330" height="130" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <text x="190" y="70" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">Entidad Agregada: MATRIMONIO</text>

    <rect x="40" y="90" width="90" height="40" rx="4" fill="#0284c7"/>
    <text x="85" y="114" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">HOMBRE</text>

    <path d="M 130 110 L 160 110" stroke="#38bdf8" stroke-width="2"/>

    <polygon points="190,92 215,110 190,128 165,110" fill="#0284c7"/>
    <text x="190" y="114" text-anchor="middle" fill="#fff" font-size="9">CASA</text>

    <path d="M 215 110 L 250 110" stroke="#38bdf8" stroke-width="2"/>

    <rect x="250" y="90" width="90" height="40" rx="4" fill="#0284c7"/>
    <text x="295" y="114" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">MUJER</text>

    <!-- Line down to Juzgado -->
    <path d="M 190 180 L 190 220" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="190,200 215,220 190,240 165,220" fill="#d97706"/>
    <text x="190" y="224" text-anchor="middle" fill="#fff" font-size="9">CIVIL EN</text>

    <path d="M 190 240 L 190 260" stroke="#f59e0b" stroke-width="2"/>
    <rect x="135" y="260" width="110" height="40" rx="4" fill="#047857"/>
    <text x="190" y="284" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">JUZGADO</text>
  </g>

  <!-- Right: Ternary Relationship -->
  <g transform="translate(440, 65)">
    <rect width="380" height="320" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="190" y="28" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">2. Relación Ternaria (3 Entidades)</text>

    <rect x="30" y="60" width="100" height="40" rx="4" fill="#047857"/>
    <text x="80" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">PROFESOR</text>

    <rect x="250" y="60" width="100" height="40" rx="4" fill="#047857"/>
    <text x="300" y="84" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">ASIGNATURA</text>

    <polygon points="190,120 225,145 190,170 155,145" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
    <text x="190" y="149" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">IMPARTE</text>

    <path d="M 80 100 L 165 145" stroke="#34d399" stroke-width="2"/>
    <path d="M 300 100 L 215 145" stroke="#34d399" stroke-width="2"/>
    <path d="M 190 170 L 190 230" stroke="#34d399" stroke-width="2"/>

    <rect x="140" y="230" width="100" height="40" rx="4" fill="#047857"/>
    <text x="190" y="254" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">GRUPO</text>

    <text x="190" y="295" text-anchor="middle" fill="#cbd5e1" font-size="11">Lectura: "Combinación de dos contra el tercero"</text>
  </g>
</svg>