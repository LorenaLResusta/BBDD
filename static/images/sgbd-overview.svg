<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Visión General de un Sistema Gestor de Bases de Datos (SGBD)</text>

  <!-- Users / Apps -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="180" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="110" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Usuarios y Apps</text>
    
    <rect x="70" y="130" width="140" height="45" rx="6" fill="#334155"/>
    <text x="140" y="157" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Apps Web / Móvil</text>
    
    <rect x="70" y="190" width="140" height="45" rx="6" fill="#334155"/>
    <text x="140" y="217" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Usuarios Finales</text>
    
    <rect x="70" y="250" width="140" height="45" rx="6" fill="#334155"/>
    <text x="140" y="277" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Administrador (DBA)</text>
    
    <rect x="70" y="305" width="140" height="40" rx="6" fill="#0284c7"/>
    <text x="140" y="330" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Consultas SQL</text>
  </g>

  <!-- Arrows 1 -->
  <path d="M 230 220 L 290 220" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 290 230 L 230 230" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- SGBD Engine -->
  <g filter="url(#shadow)">
    <rect x="300" y="80" width="220" height="280" rx="8" fill="url(#cardGrad1)"/>
    <text x="410" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">SGBD (DBMS)</text>

    <rect x="320" y="135" width="180" height="40" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="410" y="160" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Procesador de Consultas</text>

    <rect x="320" y="185" width="180" height="40" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="410" y="210" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Optimizador de SQL</text>

    <rect x="320" y="235" width="180" height="40" rx="6" fill="#ffffff" fill-opacity="0.15"/>
    <text x="410" y="260" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gestor de Transacciones</text>

    <rect x="320" y="285" width="180" height="60" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <text x="410" y="310" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Control de Seguridad e</text>
    <text x="410" y="330" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Integridad de Datos</text>
  </g>

  <!-- Arrows 2 -->
  <path d="M 520 220 L 570 220" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- Storage / DB -->
  <g filter="url(#shadow)">
    <rect x="580" y="80" width="170" height="280" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="665" y="110" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Almacenamiento</text>

    <!-- Cylinder 1: Data -->
    <path d="M 600 140 C 600 130, 730 130, 730 140 L 730 180 C 730 190, 600 190, 600 180 Z" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <ellipse cx="665" cy="140" rx="65" ry="10" fill="#10b981"/>
    <text x="665" y="167" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Datos Físicos</text>

    <!-- Cylinder 2: Metadatos -->
    <path d="M 600 210 C 600 200, 730 200, 730 210 L 730 250 C 730 260, 600 260, 600 250 Z" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <ellipse cx="665" cy="210" rx="65" ry="10" fill="#10b981"/>
    <text x="665" y="237" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Diccionario de Datos</text>

    <!-- Cylinder 3: Indices/Logs -->
    <path d="M 600 280 C 600 270, 730 270, 730 280 L 730 320 C 730 330, 600 330, 600 320 Z" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <ellipse cx="665" cy="280" rx="65" ry="10" fill="#10b981"/>
    <text x="665" y="307" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Índices y Logs</text>
  </g>

  <!-- Footer note -->
  <text x="400" y="415" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">El SGBD actúa como capa intermedia entre las aplicaciones y el almacenamiento físico de datos.</text>
</svg>