# Escape room UD03 · Modelo relacional (shortcode escape-click). Escenas en assets/escape/ud03-*.svg
# Cada hotspot "id" coincide con un <g data-hs="id"> de la escena. Tipos: puzzle (choice, multi, match, order, number), note, decoy, door.
es:
  title: "Bloqueo en el Banco Codd"
  sub: "Escape room · UD03 Modelo relacional"
  target_min: 40
  intro:
    - "Formas parte del equipo de auditoría informática del **Banco Codd**. Esta noche estáis probando el nuevo sistema de seguridad cuando algo falla: se activa el protocolo de bloqueo y te quedas encerrado en el sótano."
    - "El sistema solo libera las puertas a quien demuestre que entiende la base de datos relacional del banco. Tendrás que salir del **archivo**, de la **sala de servidores** y, por último, de la **cámara acorazada**."
  rooms:
    - id: archivo
      scene: ud03-archivo
      name: "Archivo"
      story: "Un archivo lleno de carpetas y polvo. El teclado de la puerta A pide **cuatro dígitos** y en su pantallita se lee: GRADO · CARDINALIDAD · CLAVES CANDIDATAS · RESTRICCIONES INHERENTES."
      hotspots:
        - id: listado
          kind: puzzle
          type: number
          icon: "📄"
          name: "Listado sobre la mesa"
          story: "Un listado impreso de la relación CUENTA, tal como estaba a las 00:00."
          table:
            head: ["iban", "dni_titular", "tipo", "saldo", "fecha_apertura"]
            rows:
              - ["ES01", "11111111A", "corriente", "500", "2019-03-01"]
              - ["ES02", "11111111A", "ahorro", "1200", "2021-07-15"]
              - ["ES03", "22222222B", "corriente", "80", "2022-01-10"]
              - ["ES04", "33333333C", "corriente", "0", "2023-05-02"]
              - ["ES05", "44444444D", "ahorro", "`NULL`", "2024-11-30"]
              - ["ES06", "22222222B", "ahorro", "3500", "2025-02-14"]
          prompt: "¿Cuál es el grado y cuál la cardinalidad de CUENTA en este momento?"
          fields: ["Grado", "Cardinalidad"]
          answer: [5, 6]
          hints:
            - "Uno de los dos números cuenta columnas y el otro, filas."
            - "El **grado** es el número de atributos (columnas); la **cardinalidad**, el número de tuplas (filas)."
          explain: "Grado **5** (cinco atributos) y cardinalidad **6** (seis tuplas). El grado se fija al diseñar la tabla; la cardinalidad cambia cada vez que se inserta o se borra una fila. Ojo: en el modelo E/R, «cardinalidad» significa otra cosa."
          ref: "1.2 Grado y cardinalidad"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#12-atributos-dominios-grado-y-cardinalidad"
          reward: { icon: "📄", text: "Grado = **5** · Cardinalidad = **6**" }
        - id: fichero
          kind: puzzle
          type: number
          icon: "🗂️"
          name: "Fichero de empleados"
          story: "En cada cajoncito hay fichas de empleados. La primera ficha explica las reglas de la tabla EMPLEADO:"
          list:
            - "`id_emp`: número interno; nunca se repite."
            - "`dni`: no hay dos empleados con el mismo DNI."
            - "`email`: el correo corporativo es personal e intransferible."
            - "`nombre`: puede haber dos empleados que se llamen igual."
            - "`departamento`: en cada uno trabajan muchos empleados."
            - "`extension`: todo el departamento comparte la misma extensión de teléfono."
          prompt: "¿Cuántas **claves candidatas** tiene EMPLEADO?"
          answer: 3
          hints:
            - "Una clave candidata identifica cada fila y es **mínima**: si le quitas un atributo, deja de identificar."
            - "(`dni`, `nombre`) identifica… pero no es mínima, así que no cuenta."
            - "Busca los atributos que, según las reglas, no se repiten nunca."
          explain: "`id_emp`, `dni` y `email` son claves candidatas: cada una identifica por sí sola. Se elige una como **PK** (normalmente `id_emp`) y las otras dos pasan a ser **claves alternativas (UK)**. Combinaciones como (`dni`, `nombre`) no son candidatas porque no son mínimas."
          ref: "2.1 Clave candidata y clave primaria"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#21-clave-candidata-y-clave-primaria-primary-key---pk"
          reward: { icon: "🗂️", text: "Claves candidatas = **3**" }
        - id: lampara
          kind: puzzle
          type: choice
          icon: "💡"
          name: "Lámpara de escritorio"
          story: "La lámpara no enciende. Lleva colgada una etiqueta: «Solo me enciendo para quien sepa qué significa el saldo de la cuenta ES05 del listado»."
          prompt: "En la fila de ES05, `saldo` vale `NULL`. ¿Qué significa?"
          options:
            - "Que el saldo es 0 euros"
            - "Que el saldo es una cadena vacía"
            - "Que no hay valor: el saldo es desconocido o no aplicable"
            - "Que la fila incumple la integridad y el SGBD debería haberla rechazado"
          answer: 2
          hints:
            - "Compara ES04 (saldo 0) con ES05 (saldo `NULL`): ¿significan lo mismo?"
            - "`NULL` no es un valor del dominio, sino la ausencia de valor."
          explain: "`NULL` representa la **ausencia de valor** (desconocido o no aplicable). No es 0 ni una cadena vacía: ES04 tiene saldo cero y de ES05 no sabemos el saldo. (En Oracle, eso sí, una cadena vacía `''` se guarda como `NULL`.)"
          ref: "1.3 Valores nulos"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#13-tuplas-filas-y-semántica-de-valores-nulos-null"
          reward: { icon: "💡", text: "Lámpara encendida: ya puedes leer la estantería" }
        - id: estanteria
          kind: puzzle
          type: multi
          icon: "📚"
          name: "Estantería"
          needs: [lampara]
          locked: "Está tan oscuro que no se leen los lomos de las carpetas. Necesitas luz."
          story: "A la luz de la lámpara lees los lomos: seis carpetas con supuestas «reglas que impone el propio modelo relacional». Solo algunas son verdad."
          prompt: "¿Cuáles son restricciones **inherentes** del modelo relacional?"
          options:
            - "No puede haber dos tuplas idénticas en una relación."
            - "El orden de las filas tiene significado y debe respetarse."
            - "Cada celda contiene un único valor atómico."
            - "El orden de las columnas no altera el significado de la relación."
            - "Toda tabla debe tener al menos una clave ajena."
            - "Ninguna columna puede contener valores nulos."
          answer: [0, 2, 3]
          hints:
            - "Las restricciones inherentes salen de la definición matemática de relación: un **conjunto** de tuplas."
            - "En un conjunto no hay elementos repetidos ni importa el orden."
            - "Los nulos solo están prohibidos en la clave primaria, y las claves ajenas las decide el diseñador."
          explain: "Son inherentes la **unicidad de tuplas**, la **atomicidad** y el **desorden** de filas y de columnas. Las claves ajenas y la obligatoriedad son restricciones **semánticas**, que decide el diseñador. Has marcado **3** carpetas."
          ref: "3.1 Restricciones inherentes"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#31-restricciones-inherentes-al-modelo"
          reward: { icon: "📚", text: "Restricciones inherentes = **3**" }
        - id: reloj
          kind: decoy
          icon: "🕰️"
          name: "Reloj de pared"
          text: "Son las tres de la madrugada. El reloj no tiene clave primaria, pero sí mucha prisa. Sigue buscando."
        - id: puerta
          kind: door
          icon: "🚪"
          name: "Puerta A"
          story: "El teclado pide cuatro dígitos, en este orden:"
          list:
            - "1.º el **grado** de CUENTA"
            - "2.º la **cardinalidad** de CUENTA"
            - "3.º el número de **claves candidatas** de EMPLEADO"
            - "4.º el número de **restricciones inherentes** de la estantería"
          lock: { type: digits, code: "5633" }
          hints:
            - "Todo lo que necesitas está en tu mochila."
            - "Grado y cardinalidad salen del listado; las claves, del fichero; las restricciones, de la estantería (que necesita luz)."
          explain: "5 · 6 · 3 · 3. La puerta A se abre con un chasquido."
    - id: servidores
      scene: ud03-servidores
      name: "Sala de servidores"
      story: "Los servidores zumban y una pantalla parpadea en rojo: DELETE! La puerta B **no tiene corriente**: primero tendrás que restablecerla desde los racks. Después, su teclado pide tres dígitos en el orden 🖥️ 📈 🗒️."
      hotspots:
        - id: pizarra
          kind: note
          icon: "📋"
          name: "Pizarra del esquema"
          text: "El esquema de la base de datos del banco y los datos de prueba de esta noche. Lo necesitarás para los retos de esta sala."
          pre: |
            GESTOR  (id_gestor, nombre)
                    PK: id_gestor
            CLIENTE (dni, nombre, id_gestor)
                    PK: dni · VNN: nombre
                    FK: id_gestor → GESTOR     (al borrar: puesta a nulos)
            CUENTA  (iban, dni_titular, saldo)
                    PK: iban · VNN: dni_titular
                    FK: dni_titular → CLIENTE  (al borrar: en cascada)
            TARJETA (num_tarjeta, iban)
                    PK: num_tarjeta · VNN: iban
                    FK: iban → CUENTA          (al borrar: en cascada)
          table:
            - caption: "GESTOR"
              head: ["id_gestor", "nombre"]
              rows: [["G1", "Marta"], ["G2", "Iván"]]
            - caption: "CLIENTE"
              head: ["dni", "nombre", "id_gestor"]
              rows: [["111A", "Ana", "G1"], ["222B", "Bruno", "G2"], ["333C", "Carla", "`NULL`"]]
            - caption: "CUENTA"
              head: ["iban", "dni_titular", "saldo"]
              rows: [["ES01", "111A", "500"], ["ES02", "111A", "1200"], ["ES03", "222B", "80"], ["ES04", "333C", "0"]]
            - caption: "TARJETA"
              head: ["num_tarjeta", "iban"]
              rows: [["T1", "ES01"], ["T2", "ES01"], ["T3", "ES02"], ["T4", "ES03"], ["T5", "ES04"]]
        - id: consola
          kind: puzzle
          type: multi
          icon: "🖥️"
          name: "Consola"
          story: "En la consola hay seis operaciones pendientes. Cada una se ejecutaría **por separado**, partiendo de los datos de la pizarra."
          prompt: "¿Cuáles **rechazaría** el SGBD?"
          options:
            - "Insertar en CUENTA la fila (ES05, 444D, 300)."
            - "Insertar en CLIENTE la fila (444D, Diego, `NULL`)."
            - "Insertar en TARJETA la fila (T6, `NULL`)."
            - "Insertar en CUENTA la fila (ES03, 333C, 10)."
            - "Borrar el gestor G2."
            - "Cambiar el saldo de ES04 a 50."
          answer: [0, 2, 3]
          hints:
            - "Comprueba cada operación contra las PK, los VNN y las FK del esquema."
            - "Una FK solo admite valores que existan en la tabla referenciada… o `NULL`, si la columna no es obligatoria."
            - "Borrar G2 no se rechaza: mira qué política tiene la FK de CLIENTE hacia GESTOR."
          explain: "Se rechazan **3**: ES05 apunta a un cliente que no existe (integridad referencial), T6 deja vacía una FK obligatoria (VNN) y ES03 repite una clave primaria. Insertar a Diego sin gestor es válido (FK opcional), borrar G2 pone a `NULL` el gestor de Bruno y cambiar un saldo no afecta a ninguna clave."
          ref: "3.3 Integridad referencial"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación"
          reward: { icon: "🖥️", text: "🖥️ = **3** operaciones rechazadas" }
        - id: monitor
          kind: puzzle
          type: number
          icon: "📈"
          name: "Monitor de alarmas"
          story: "La alarma avisa: alguien ha lanzado la orden **borrar a la clienta Ana (111A)**. Antes de que se ejecute, el sistema quiere saber cuánto daño hará."
          prompt: "Con las políticas de la pizarra, ¿cuántas filas desaparecen en total de las cuatro tablas, contando la de Ana?"
          answer: 6
          hints:
            - "Sigue las flechas: CLIENTE → CUENTA → TARJETA. Las dos FK son «en cascada»."
            - "Ana tiene 2 cuentas. ¿Cuántas tarjetas tienen esas cuentas?"
            - "1 clienta + 2 cuentas + 3 tarjetas."
          explain: "Se borra Ana (**1**); en cascada, sus cuentas ES01 y ES02 (**2**); y, en cascada otra vez, las tarjetas T1, T2 y T3 (**3**). Total: **6**. GESTOR no cambia: el borrado se propaga de la tabla padre a la hija, nunca hacia arriba."
          ref: "3.3 Políticas de borrado"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación"
          reward: { icon: "📈", text: "📈 = **6** filas borradas" }
        - id: postit
          kind: puzzle
          type: number
          icon: "🗒️"
          name: "Pósit en la pared"
          story: "«Ojo: en el banco de verdad, la PK de CUENTA no es `iban`, sino (`cod_entidad`, `cod_sucursal`, `num_cuenta`). Hay que rehacer la FK de MOVIMIENTO.»"
          prompt: "¿Cuántas columnas debe tener la clave ajena de MOVIMIENTO hacia CUENTA?"
          answer: 3
          hints:
            - "Una FK debe coincidir con la clave primaria (o alternativa) a la que apunta."
            - "Si la PK referenciada es compuesta, la FK también lo es."
          explain: "Una FK referencia la PK **completa**: si la PK de CUENTA tiene 3 columnas, la FK de MOVIMIENTO también tiene **3** (`cod_entidad`, `cod_sucursal`, `num_cuenta`) y se declara como **una sola** restricción compuesta, no como tres FK sueltas."
          ref: "2.4 Claves compuestas"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#24-claves-primarias-compuestas"
          reward: { icon: "🗒️", text: "🗒️ = **3** columnas" }
        - id: rack
          kind: puzzle
          type: match
          icon: "🔌"
          name: "Racks de servidores"
          story: "Un rack muestra un aviso: «Energía de la puerta B cortada. Para restablecerla, configura bien la política de borrado de cada clave ajena del nuevo módulo»."
          prompt: "Cuando se borra la fila padre, ¿qué política es la más adecuada en cada caso?"
          items:
            - "Los **clientes** de un gestor que se jubila (más adelante se les asignará otro)."
            - "Las **cajas de seguridad** de una sucursal que cierra: pasan a la sucursal central `0001`."
            - "Los **movimientos** de una cuenta que se cancela y se borra."
            - "Las **cuentas** de un cliente al que alguien intenta borrar por error."
          choices: ["En cascada", "Restringido (rechazar)", "Puesta a nulos", "Puesta a valor por defecto"]
          answer: [2, 3, 0, 1]
          hints:
            - "Pregúntate por la fila hija: ¿tiene sentido que siga existiendo sin su padre?"
            - "Si no tiene sentido → cascada. Si lo tiene, pero se queda sin padre un tiempo → nulos. Si no debería pasar nunca → restringido."
          explain: "Movimientos → **cascada** (no tienen sentido sin su cuenta); clientes → **puesta a nulos** (siguen siendo clientes); cuentas → **restringido** (hay que impedir borrar un cliente con cuentas); cajas → **valor por defecto** (`0001`). Recuerda que Oracle solo ofrece cascada, puesta a nulos o rechazar."
          ref: "3.3 Políticas de borrado"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación"
          reward: { icon: "⚡", text: "Corriente restablecida en la puerta B" }
        - id: extintor
          kind: decoy
          icon: "🧯"
          name: "Extintor"
          text: "Un extintor de CO₂, el adecuado para fuegos eléctricos. Esperemos no necesitarlo, ni para los servidores ni para tu cabeza."
        - id: puerta
          kind: door
          icon: "🚪"
          name: "Puerta B"
          needs: [rack]
          locked: "El teclado está apagado: la puerta no tiene corriente."
          story: "El teclado vuelve a la vida. Tres dígitos, en el orden de las pegatinas."
          lock: { type: digits, code: "363", order: "🖥️ 📈 🗒️" }
          hints:
            - "Los tres números están en tu mochila: consola, monitor y pósit."
          explain: "3 · 6 · 3. La puerta B se abre con un silbido."
    - id: camara
      scene: ud03-camara
      name: "Cámara acorazada"
      story: "La cámara acorazada. La puerta circular tiene una rueda de combinación de **tres dígitos** y dos cerraduras laterales que necesitan las dos mitades de la **llave del director**. La pantalla de la puerta dice: COLUMNAS PK · TABLAS · REGLAS NO EXPRESABLES."
      hotspots:
        - id: caja12
          kind: puzzle
          type: choice
          icon: "🔐"
          name: "Caja de seguridad 12"
          story: "Dentro de la caja está el diagrama del servicio de cajas: CLIENTE (0,n) — AUTORIZA — (0,n) CAJA, con el atributo `fecha_alta` en la relación. Un cliente puede estar autorizado a abrir varias cajas y una caja puede tener varios autorizados."
          prompt: "¿Cuál es la clave primaria de la tabla AUTORIZA?"
          options: ["(`dni`)", "(`num_caja`)", "(`dni`, `num_caja`)", "(`dni`, `num_caja`, `fecha_alta`)"]
          answer: 2
          hints:
            - "Una N:M siempre genera una tabla nueva."
            - "Su PK está formada por las claves de las dos entidades. Los atributos de la relación no entran, salvo que una misma pareja pueda repetirse."
          explain: "Una N:M se transforma en una tabla con las claves de las dos entidades como **PK compuesta** y cada una como FK: AUTORIZA(`dni`, `num_caja`, `fecha_alta`). La PK tiene **2** columnas."
          ref: "4.5 Relaciones N:M"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#45-transformación-de-relaciones-binarias-nm"
          reward: { icon: "🔐", text: "PK de AUTORIZA = **2** columnas" }
        - id: caja27
          kind: puzzle
          type: choice
          icon: "🔐"
          name: "Caja de seguridad 27"
          story: "Diagrama: SUCURSAL (1,1) — CUSTODIA — (0,n) CAJA. Cada caja está en una única sucursal; una sucursal puede tener muchas cajas, o ninguna."
          prompt: "¿Cómo se transforma CUSTODIA?"
          options:
            - "Con una FK `num_caja` en SUCURSAL"
            - "Con una FK `cod_sucursal` en CAJA, sin VNN"
            - "Con una FK `cod_sucursal` en CAJA, con VNN"
            - "Con una tabla nueva CUSTODIA (`cod_sucursal`, `num_caja`)"
          answer: 2
          hints:
            - "En una 1:N, la FK viaja al lado N."
            - "¿Puede existir una caja sin sucursal? Fíjate en la cardinalidad mínima junto a SUCURSAL."
          explain: "La FK va al lado **N** (CAJA) y, como toda caja está en una sucursal (mínimo 1), lleva **VNN**: CAJA(`num_caja`, …, `cod_sucursal`) · FK: `cod_sucursal` → SUCURSAL · VNN: `cod_sucursal`."
          ref: "4.4 Relaciones 1:N"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#44-transformación-de-relaciones-binarias-1n"
          reward: { icon: "🗝️", text: "Mitad izquierda de la llave del director" }
        - id: caja33
          kind: puzzle
          type: multi
          icon: "🔐"
          name: "Caja de seguridad 33"
          story: "Diagrama: EMPLEADO (0,1) — USA — (1,1) TARJETA_ACCESO. Cada tarjeta pertenece exactamente a un empleado y cada empleado tiene, como mucho, una tarjeta. Se transforma así: TARJETA_ACCESO(`id_tarjeta`, `nivel`, `id_emp`) · PK: `id_tarjeta`."
          prompt: "¿Qué restricciones lleva `id_emp` en TARJETA_ACCESO?"
          options: ["PK", "FK → EMPLEADO", "UK", "VNN"]
          answer: [1, 2, 3]
          hints:
            - "¿Puede faltar? Toda tarjeta pertenece a un empleado."
            - "¿Puede repetirse? Un empleado tiene, como mucho, una tarjeta."
            - "La PK de la tabla ya es `id_tarjeta`."
          explain: "`id_emp` es **FK** (apunta a EMPLEADO), **VNN** (toda tarjeta tiene dueño) y **UK** (un empleado no puede tener dos tarjetas). Es el patrón de la 1:1 (1,1)-(0,1)."
          ref: "4.6 Relaciones 1:1"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#46-transformación-de-relaciones-binarias-11"
          reward: { icon: "🗝️", text: "Mitad derecha de la llave del director" }
        - id: carro
          kind: puzzle
          type: number
          icon: "💰"
          name: "Carro de lingotes"
          story: "Sobre los lingotes hay una etiqueta con el modelo E/R del banco, en forma de lista:"
          list:
            - "Entidades: SUCURSAL, EMPLEADO, CLIENTE, CUENTA y CAJA."
            - "Cada empleado trabaja en una sucursal; una sucursal tiene uno o varios empleados."
            - "Un empleado puede supervisar a otros; cada empleado tiene, como mucho, un supervisor."
            - "Un cliente puede ser titular de varias cuentas y una cuenta puede tener varios titulares."
            - "Cada cuenta está domiciliada en una sucursal."
            - "Un cliente puede tener varios teléfonos (atributo multivaluado)."
            - "Un cliente alquila cajas; cada caja la alquila, como mucho, un cliente."
          prompt: "¿Cuántas tablas tendrá el esquema relacional?"
          answer: 7
          hints:
            - "Cada entidad es una tabla. Después, mira qué relaciones generan una tabla nueva."
            - "Las 1:N (también la reflexiva) se resuelven con una FK: no crean tabla."
            - "La N:M y el atributo multivaluado sí crean una tabla cada uno."
          explain: "5 entidades + 1 tabla para la N:M (TITULAR) + 1 para el multivaluado (TELEFONO) = **7**. Trabajar, supervisar, domiciliar y alquilar son 1:N y se resuelven con una FK."
          ref: "4.12 Tabla resumen"
          ref_url: "/ud03-modelo-relacional/ud03-teoria/#412-tabla-resumen-patrones-de-transformación"
          reward: { icon: "💰", text: "Tablas del esquema = **7**" }
        - id: terminal
          kind: puzzle
          type: multi
          icon: "🧾"
          name: "Terminal"
          story: "El terminal pide revisar la documentación de restricciones. Muestra seis reglas de negocio del banco."
          prompt: "¿Cuáles **no** se pueden expresar solo con PK, FK, UK y VNN?"
          options:
            - "Toda sucursal tiene al menos un empleado."
            - "Cada cuenta está domiciliada en exactamente una sucursal."
            - "Todo cliente es titular de al menos una cuenta."
            - "El número de empleado no se repite."
            - "Ningún empleado puede supervisarse a sí mismo, ni directa ni indirectamente."
            - "Una caja la alquila, como mucho, un cliente."
          answer: [0, 2, 4]
          hints:
            - "La mínima 1 en el lado «1» de una 1:N y la mínima 1 en una N:M se pierden al transformar."
            - "Los ciclos en una reflexiva obligan a recorrer varias filas."
            - "«Exactamente una» en el lado N se consigue con FK + VNN."
