    ref_url: /ud02-modelo-er/ud02-teoria/#22-atributs-classificació-estructura-i-domini
  - l: V
    mode: contiene
    clue: Atribut que pot prendre diversos valors per a una mateixa instància, com els telèfons d'una persona.
    answers:
    - multivalorat
    ref: 2.2 Atributs
    ref_url: /ud02-modelo-er/ud02-teoria/#22-atributs-classificació-estructura-i-domini
