    - id: esclusa
      scene: ud08-esclusa
      name: "Resclosa"
      story: "A l'altra banda de l'escotilla espera la nau de rescat. L'escotilla demana **tres dígits** (🛰️ 🚨) i que hages revisat els procediments, els disparadors i el tauler de programació."
      hotspots:
        - id: funcion
          kind: puzzle
          type: number
          icon: "🛰️"
          name: "Panell d'oxigen"
          story: "El panell calcula les reserves d'oxigen amb una funció:"
          pre: |
            CREATE OR REPLACE FUNCTION fn_oxigeno (
              p_tripulantes IN NUMBER,
              p_horas       IN NUMBER
            ) RETURN NUMBER IS
            BEGIN
              IF p_horas > 10 THEN
                RETURN p_tripulantes * 2;
              END IF;
              RETURN p_tripulantes + p_horas;
            END fn_oxigeno;
            /

            SELECT fn_oxigeno(3, 12) + fn_oxigeno(2, 5) AS reserva
            FROM   dual;
          prompt: "Quin valor torna la consulta?"
          answer: 13
          hints:
            - "Calcula cada crida per separat."
            - "`RETURN` acaba la funció en eixe mateix instant."
          explain: "`fn_oxigeno(3, 12)`: 12 > 10, torna 3 · 2 = 6. `fn_oxigeno(2, 5)`: no entra en l'`IF` i torna 2 + 5 = 7. Total: **13**. Una funció es pot usar en un `SELECT` perquè **torna un valor**."
          ref: "8.4 Usar una funció"
          ref_url: "/ud08-plsql/ud08-teoria/#84-usar-una-funció"
          reward: { icon: "🛰️", text: "🛰️ = **13**" }
        - id: herramientas
          kind: puzzle
          type: number
          icon: "🧰"
          name: "Caixa d'eines"
          story: "Dins de la caixa hi ha un procediment d'ajust amb paràmetres dels tres tipus:"
          img: ud08-parametros
          img_text: [["bloque que llama", "bloc que crida"], ["IN: entra · OUT: sale · IN OUT: entra y vuelve modificado", "IN: entra · OUT: ix · IN OUT: entra i torna modificat"]]
          pre: |
            CREATE OR REPLACE PROCEDURE pr_ajuste (
              p_a IN     NUMBER,
              p_b IN OUT NUMBER,
              p_c OUT    NUMBER
            ) IS
            BEGIN
              p_b := p_b + p_a;
              p_c := p_b * 2;
            END pr_ajuste;
            /

            DECLARE
              x NUMBER := 2;
              y NUMBER := 5;
              z NUMBER;
            BEGIN
              pr_ajuste(x, y, z);
              DBMS_OUTPUT.PUT_LINE(y || '-' || z);
            END;
            /
          prompt: "Quins valors tenen `y` i `z` després de la crida?"
          fields: ["`y`", "`z`"]
          answer: [7, 14]
          hints:
            - "`p_b` és `IN OUT`: rep el valor de `y` i el canvi torna a `y`."
            - "`p_c` es calcula amb el valor **nou** de `p_b`."
          explain: "`p_b` comença en 5 i passa a 5 + 2 = **7**, que torna a `y`. `p_c` = 7 · 2 = **14**, que ix per `z`. Es mostra `7-14`. Un paràmetre `IN` no es pot modificar dins del procediment."
          ref: "10.2 Paràmetres IN, OUT i IN OUT"
          ref_url: "/ud08-plsql/ud08-teoria/#102-paràmetres-in-out-i-in-out"
          reward: { icon: "🧰", text: "Procediment revisat: `7-14`" }
        - id: alarma
          kind: puzzle
          type: number
          icon: "🚨"
          name: "Alarma"
          story: "L'alarma es dispara amb estos dos disparadors sobre la taula SENSOR:"
          img: ud08-disparo
          img_text: [["(n filas)", "(n files)"], ["BEFORE sentencia", "BEFORE sentència"], ["AFTER sentencia", "AFTER sentència"], [">cambio<", ">canvi<"], ["Disparadores de sentencia: una vez por orden · de fila (FOR EACH ROW): una vez por fila", "Disparadors de sentència: una vegada per orde · de fila (FOR EACH ROW): una vegada per fila"]]
          pre: |
            CREATE OR REPLACE TRIGGER trg_sensor_aviso
              BEFORE UPDATE ON sensor
            BEGIN
              pkg_alarma.avisar;
            END;
            /
            CREATE OR REPLACE TRIGGER trg_sensor_log
              AFTER UPDATE ON sensor
              FOR EACH ROW
            BEGIN
              INSERT INTO sensor_log VALUES (:OLD.id_sensor, :OLD.valor, :NEW.valor, SYSDATE);
            END;
            /

            UPDATE sensor SET valor = 0 WHERE zona = 'Esclusa';   -- afecta 4 files
          prompt: "Quantes execucions de disparador hi ha en total amb eixe `UPDATE`?"
          answer: 5
          hints:
            - "El primer no té `FOR EACH ROW`: és de sentència."
            - "El segon és de fila: s'executa una vegada per cada fila modificada."
          explain: "`trg_sensor_aviso` és **de sentència**: 1 vegada. `trg_sensor_log` és **de fila**: 4 vegades, una per fila. Total: **5**."
          ref: "11.1 Què és un disparador"
          ref_url: "/ud08-plsql/ud08-teoria/#111-què-és-un-disparador-i-com-es-construïx"
          reward: { icon: "🚨", text: "🚨 = **5**" }
        - id: antena
          kind: puzzle
          type: choice
          icon: "📡"
          name: "Antena :NEW / :OLD"
          story: "L'antena rep els noms de la tripulació amb majúscules i minúscules mesclades. Es vol un disparador que els guarde **sempre en majúscules** en inserir."
          prompt: "Quina combinació funciona?"
          options:
            - "`BEFORE INSERT … FOR EACH ROW` amb `:NEW.nombre := UPPER(:NEW.nombre);`"
            - "`AFTER INSERT … FOR EACH ROW` amb `:NEW.nombre := UPPER(:NEW.nombre);`"
            - "`BEFORE INSERT` (sense `FOR EACH ROW`) amb `:NEW.nombre := UPPER(:NEW.nombre);`"
            - "`BEFORE INSERT … FOR EACH ROW` amb `:OLD.nombre := UPPER(:NEW.nombre);`"
          answer: 0
          hints:
            - "`:NEW` i `:OLD` només existixen en els disparadors **de fila**."
            - "Per a canviar el valor que es guardarà, cal fer-ho **abans** de guardar-lo."
          explain: "Només en un disparador **BEFORE … FOR EACH ROW** es pot modificar `:NEW`. En un `AFTER` la fila ja està guardada (ORA-04084), un de sentència no té `:NEW` (ORA-04082) i en un `INSERT` `:OLD` no té valors."
          ref: "11.4 Normalització de dades en guardar"
          ref_url: "/ud08-plsql/ud08-teoria/#114-normalització-de-dades-en-guardar"
          reward: { icon: "📡", text: "Disparador de majúscules validat" }
        - id: tablero
          kind: puzzle
          type: match
          icon: "📋"
          name: "Tauler de programació"
          story: "En el tauler, quatre tasques pendents del programari de l'estació."
          prompt: "Quina eina és l'adequada per a cadascuna?"
          items:
            - "Executar cada nit a les 3:00 la neteja dels registres antics"
            - "Calcular les hores d'oxigen restants dins d'un `SELECT`"
            - "Guardar automàticament qui canvia el nivell d'un tripulant"
            - "Donar d'alta un tripulant (diverses taules alhora) des de l'aplicació"
          choices: ["Funció", "Procediment", "Disparador (trigger)", "Tasca programada (DBMS_SCHEDULER)"]
          answer: [3, 0, 2, 1]
          hints:
            - "El que s'usa dins d'un `SELECT` ha de **tornar un valor**."
            - "Un disparador reacciona a un canvi en una taula; una tasca programada, al rellotge."
          explain: "Cada nit → **tasca programada**; dins d'un `SELECT` → **funció**; reaccionar a canvis → **disparador**; una operació de negoci que es crida des de l'aplicació → **procediment**."
          ref: "12.1 Disparador, procediment o tasca programada"
          ref_url: "/ud08-plsql/ud08-teoria/#121-disparador-procediment-o-tasca-programada"
          reward: { icon: "📋", text: "Tauler en ordre" }
        - id: traje
          kind: decoy
          icon: "🧑‍🚀"
          name: "Vestit espacial"
          text: "És de la teua talla, però el casc té una esquerda. Millor eixir per l'escotilla, amb la nau de rescat acoblada."
        - id: puerta
          kind: door
          icon: "🛸"
          name: "Escotilla"
          needs: [herramientas, antena, tablero]
          locked: "L'escotilla no es desbloqueja fins revisar el procediment de la caixa d'eines, l'antena i el tauler."
          story: "Tres dígits: els dos del panell d'oxigen i el de l'alarma (🛰️ 🚨)."
          lock: { type: digits, code: "135", order: "🛰️ 🚨" }
          hints:
            - "13 · ?"
          explain: "13 · 5. L'escotilla s'obri i la nau de rescat t'espera. `COMMIT`!"
  ending:
    title: "A salvament en la nau de rescat!"
    text:
      - "Mentre l'estació Kepler s'allunya per la finestreta, l'informe d'incidències es guarda tot sol: algú va programar un disparador per a això."
      - "Blocs, cursors, excepcions, funcions, procediments i disparadors: ja saps posar la lògica on estan les dades."
