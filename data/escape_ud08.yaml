    - id: laboratorio
      scene: ud08-laboratorio
      name: "Laboratori"
      story: "En el laboratori, la pantalla mostra la taula TRIPULANTE. La comporta LAB-2 demana **quatre dígits** (🧬 📟 🧪) i que el sistema de cursors estiga calibrat."
      hotspots:
        - id: pantalla
          kind: note
          icon: "📺"
          name: "Pantalla de tripulació"
          text: "La taula TRIPULANTE amb les dades d'este matí. Els reptes de la sala treballen sobre ella (i cadascun partix d'estes dades, sense els canvis dels altres)."
          table:
            caption: "TRIPULANTE"
            head: ["id_trip", "nombre", "modulo", "rango"]
            rows:
              - ["1", "Ada", "Lab", "3"]
              - ["2", "Bo", "Puente", "2"]
              - ["3", "Cyn", "Lab", "1"]
              - ["4", "Dev", "Motores", "2"]
              - ["5", "Eli", "Lab", "2"]
              - ["6", "Fer", "Puente", "3"]
        - id: centrifugadora
          kind: puzzle
          type: number
          icon: "🧬"
          name: "Centrifugadora"
          story: "La centrifugadora recorre la taula amb un cursor `FOR`:"
          pre: |
            DECLARE
              v_c NUMBER := 0;
            BEGIN
              FOR r IN (SELECT rango FROM tripulante WHERE modulo <> 'Motores') LOOP
                v_c := v_c + r.rango;
              END LOOP;
              DBMS_OUTPUT.PUT_LINE(v_c);
            END;
            /
          prompt: "Què mostra `DBMS_OUTPUT`?"
          answer: 11
          hints:
            - "El cursor recorre totes les files que no són de Motores."
            - "Només queden fora les files de Dev."
          explain: "Se sumen els rangs d'Ada, Bo, Cyn, Eli i Fer: 3 + 2 + 1 + 2 + 3 = **11**. El cursor `FOR` obri, recorre i tanca el cursor tot sol, i declara `r` automàticament."
          ref: "7.3 Cursor FOR"
          ref_url: "/ud08-plsql/ud08-teoria/#73-cursor-for-la-forma-habitual"
          reward: { icon: "🧬", text: "🧬 = **11**" }
        - id: terminal
          kind: puzzle
          type: number
          icon: "📟"
          name: "Terminal"
          story: "El terminal puja de rang qui fa poc de temps que està a bord:"
          pre: |
            BEGIN
              UPDATE tripulante
                 SET rango = rango + 1
               WHERE rango < 3;
              DBMS_OUTPUT.PUT_LINE(SQL%ROWCOUNT);
            END;
            /
          prompt: "Què mostra `DBMS_OUTPUT`?"
          answer: 4
          hints:
            - "`SQL%ROWCOUNT` és un atribut del cursor implícit: quantes files va afectar l'última sentència DML."
            - "Compta les files amb rang 1 o 2."
          explain: "Tenen rang menor que 3 Bo, Cyn, Dev i Eli: **4** files. `SQL%ROWCOUNT` es consulta just després de la sentència, perquè la següent el sobreescriu."
          ref: "7.1 El cursor implícit"
          ref_url: "/ud08-plsql/ud08-teoria/#71-què-és-un-cursor-i-quin-és-limplícit"
          reward: { icon: "📟", text: "📟 = **4**" }
        - id: microscopio
          kind: puzzle
          type: choice
          icon: "🧪"
          name: "Microscopi"
          story: "El microscopi vol el nom de «la persona del laboratori»:"
          pre: |
            DECLARE
              v_nombre tripulante.nombre%TYPE;
            BEGIN
              SELECT nombre INTO v_nombre
              FROM   tripulante
              WHERE  modulo = 'Lab';
              DBMS_OUTPUT.PUT_LINE(v_nombre);
            END;
            /
          prompt: "Què passa en executar-lo?"
          options:
            - "Mostra `Ada`, la primera fila que troba"
            - "Salta `NO_DATA_FOUND`"
            - "Salta `TOO_MANY_ROWS`, perquè la consulta torna 3 files"
            - "Salta `VALUE_ERROR`, perquè `%TYPE` no és compatible"
          answer: 2
          hints:
            - "`SELECT … INTO` necessita que la consulta torne **exactament una** fila."
            - "Quants tripulants són del mòdul Lab?"
          explain: "La consulta torna **3** files (Ada, Cyn i Eli) i `SELECT … INTO` només n'admet una: salta **TOO_MANY_ROWS** (ORA-01422). Si no en tornara cap, saltaria `NO_DATA_FOUND`. Per a diverses files s'usa un cursor."
          ref: "9.2 Excepcions predefinides"
          ref_url: "/ud08-plsql/ud08-teoria/#92-excepcions-predefinides"
          reward: { icon: "🧪", text: "🧪 = **3** (files del `SELECT … INTO`)" }
        - id: probetas
          kind: puzzle
          type: order
          icon: "⚗️"
          name: "Gradeta de provetes"
          story: "Cinc provetes, cinc passos d'un cursor explícit. Algú les ha desordenades i el sistema de cursors no arranca."
          prompt: "Ordena els passos per a recórrer un cursor explícit."
          items:
            - "Declarar-lo: `CURSOR c_lab IS SELECT … ;`"
            - "Obrir-lo: `OPEN c_lab;`"
            - "Llegir una fila: `FETCH c_lab INTO v_fila;`"
            - "Eixir si no queden files: `EXIT WHEN c_lab%NOTFOUND;`"
            - "Tancar-lo: `CLOSE c_lab;`"
          hints:
            - "La declaració va en la secció `DECLARE`; la resta, en `BEGIN`."
            - "La comprovació de `%NOTFOUND` va just després de cada `FETCH`."
          explain: "Declarar → `OPEN` → `FETCH` → `EXIT WHEN %NOTFOUND` (dins d'un `LOOP`) → `CLOSE`. El cursor `FOR` fa tot això tot sol, per això és la forma habitual."
          ref: "7.2 Cursors explícits"
          ref_url: "/ud08-plsql/ud08-teoria/#72-cursors-explícits"
          reward: { icon: "⚗️", text: "Sistema de cursors calibrat" }
        - id: frasco
          kind: decoy
