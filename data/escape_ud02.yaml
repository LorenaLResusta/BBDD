# Escape room UD02 · Modelo E/R (shortcode escape-click). Escenas en assets/escape/ud02-*.svg
# Cada hotspot "id" coincide con un <g data-hs="id"> de la escena. Tipos: puzzle (choice, multi, match, order, number), note, decoy, door.
es:
  title: "¡Corten! Fuga del plató"
  sub: "Escape room · UD02 Modelo Entidad/Relación"
  target_min: 35
  intro:
    - "Eres becario o becaria de **Estudios Chen**, la productora que rueda la serie juvenil *Instituto Cardinal*. Al terminar la grabación de esta noche se va la luz y el sistema de seguridad bloquea todas las puertas del plató."
    - "Mara, la jefa de datos de la productora, protegió cada cerradura con preguntas sobre el modelo E/R de la serie («si no sabes leer un diagrama, no toques mi base de datos»). Tienes que atravesar el **camerino**, la **sala de guionistas** y el **control de realización** antes de que llegue el equipo de mañana."
  rooms:
    - id: camerino
      scene: ud02-camerino
      name: "Camerino"
      story: "La puerta del camerino tiene un teclado de tres dígitos. Junto a él, alguien ha pegado tres pegatinas: 💄 🪞 👗. La sala huele a laca y a prisa."
      hotspots:
        - id: espejo
          kind: puzzle
          type: match
          icon: "🪞"
          name: "Espejo de bombillas"
          story: "En una esquina del espejo hay un pósit con la ficha que la productora guarda de cada actor o actriz del reparto, con las notas de Mara."
          prompt: "¿Qué tipo de atributo es cada uno en el modelo E/R?"
          items:
            - "`telefonos`: uno o varios por persona"
            - "`dni`: no hay dos iguales y es el que usamos para identificar"
            - "`edad`: se calcula a partir de la fecha de nacimiento"
            - "`nombre_real`: nombre, primer apellido y segundo apellido"
            - "`nombre_artistico`: lo que sale en los créditos (dos actores pueden coincidir)"
            - "`num_seg_social`: tampoco se repite, pero no lo usamos para identificar"
          choices: ["Identificador principal", "Identificador alternativo", "Compuesto", "Multivaluado", "Derivado", "Simple (descriptor)"]
          answer: [3, 0, 4, 2, 5, 1]
          hints:
            - "Los dos identificadores no se repiten nunca: el principal es el elegido (subrayado) y el alternativo, el que también podría serlo (subrayado discontinuo)."
            - "Si un dato se puede calcular, no se guarda: es **derivado** (elipse discontinua)."
            - "Varios valores para la misma persona → multivaluado. Varias partes con significado propio → compuesto."
          explain: "`dni` identifica (principal) y `num_seg_social` también podría hacerlo (alternativo). `nombre_real` se descompone en partes (compuesto), `telefonos` admite varios valores (multivaluado), `edad` se calcula (derivado) y `nombre_artistico` es un descriptor simple que puede repetirse."
          ref: "2.2 Atributos: clasificación"
          ref_url: "/ud02-modelo-er/ud02-teoria/#22-atributos-clasificación-estructura-y-dominio"
          reward: { icon: "🪞", text: "🪞 = **4** (escrito con pintalabios detrás del pósit)" }
        - id: vestuario
          kind: puzzle
          type: choice
          icon: "👗"
          name: "Burro de vestuario"
          story:
            - "Cada prenda lleva cosida una etiqueta: *ICARD · prenda 7*. Junto al burro, una nota del departamento de vestuario:"
            - "«Las prendas se numeran desde 1 **dentro de cada serie**: la serie ICARD tiene su prenda 7 y la serie MARINA también tiene una prenda 7. De cada prenda guardamos talla, color y estado. Si una serie se cancela y se borra, su vestuario se destruye.»"
          prompt: "¿Cómo modelas PRENDA en el diagrama E/R?"
          options:
            - "Entidad fuerte con identificador `num_prenda`"
            - "Entidad débil por existencia, identificada solo con `num_prenda`"
            - "Entidad débil por identificación: se identifica con el código de la serie más `num_prenda`"
            - "Atributo multivaluado `prendas` de SERIE"
          answer: 2
          hints:
            - "¿Basta `num_prenda` para distinguir la prenda 7 de ICARD de la prenda 7 de MARINA?"
            - "Si una entidad necesita la clave de otra para identificarse, depende de ella para algo más que existir."
            - "Un atributo multivaluado no sirve cuando de cada valor guardas datos propios (talla, color, estado…)."
          explain: "PRENDA no existe sin su serie (dependencia de existencia) y, además, `num_prenda` solo es único **dentro** de cada serie: su identificador es (código de serie, `num_prenda`). Es una entidad **débil por identificación**: doble rectángulo y relación identificadora con SERIE."
          ref: "2.1 Entidades fuertes y débiles"
          ref_url: "/ud02-modelo-er/ud02-teoria/#21-entidades-fuertes-débiles-e-instancias"
          reward: { icon: "🔑", text: "Una llavecita en el bolsillo de una chaqueta · 👗 = **7**" }
        - id: tocador
          kind: puzzle
          type: number
          icon: "💄"
          name: "Tocador de maquillaje"
          needs: [vestuario]
          locked: "El cajón del tocador está cerrado con llave. La cerradura es diminuta… quizá la llave esté escondida en algún lugar del camerino."
          story:
            - "Con la llavecita abres el cajón. Dentro hay una hoja de requisitos arrugada:"
            - "«Estudios Chen quiere guardar sus series (código, título y cadena) y los capítulos de cada serie (número, título y duración en minutos). Cada capítulo lo protagonizan varios actores, de los que guardamos DNI, nombre y color de pelo, para maquillaje. Cada actor interpreta uno o varios personajes, de los que interesa su nombre y su apodo. Los camerinos (número y planta) se asignan a los actores durante el rodaje.»"
          prompt: "Mara ha subrayado ocho palabras: *serie, cadena, capítulo, duración, actor, color de pelo, personaje, camerino*. ¿Cuántas deben ser **entidades** en el diagrama?"
          answer: 5
          hints:
            - "Una entidad tiene propiedades propias que interesa guardar y muchas instancias distintas."
            - "Un dato que solo describe a otra cosa, y del que no guardas nada más, es un atributo."
            - "Cadena, duración y color de pelo describen a otra cosa: en el enunciado no tienen datos propios."
          explain: "Son entidades SERIE, CAPÍTULO, ACTOR, PERSONAJE y CAMERINO: de cada una se guardan varios datos. `cadena`, `duracion` y `color_pelo` son atributos de SERIE, CAPÍTULO y ACTOR. Si mañana hubiera que guardar el teléfono o la web de cada cadena, CADENA pasaría a ser entidad."
          ref: "5. Fases en la construcción del esquema"
          ref_url: "/ud02-modelo-er/ud02-teoria/#5-fases-en-la-construcción-del-esquema-conceptual"
          reward: { icon: "💄", text: "💄 = **5**" }
        - id: poster
          kind: decoy
          icon: "🖼️"
          name: "Póster de la serie"
          text: "Es el póster de la primera temporada de *Instituto Cardinal*. Alguien ha escrito en una esquina: «el amor es 1:1, la amistad es N:M». Muy bonito, pero aquí no hay ningún número."
        - id: puerta
          kind: door
          icon: "🚪"
          name: "Puerta del camerino"
          story: "Un teclado de tres dígitos. Las pegatinas indican el orden en que hay que introducir los números que encuentres."
          lock: { type: digits, code: "547", order: "💄 🪞 👗" }
          hints:
            - "Mira tu mochila: cada reto resuelto de esta sala te dio un número."
            - "El orden es el de las pegatinas: primero el número del tocador, luego el del espejo y por último el del vestuario."
          explain: "Cada dígito era la recompensa de un reto: 💄 5 · 🪞 4 · 👗 7."
    - id: guionistas
      scene: ud02-guionistas
      name: "Sala de guionistas"
      story: "La sala de guionistas está llena de café frío y teorías sobre la segunda temporada. La puerta tiene una **cerradura de flechas** y, pegadas en ella, cuatro frases sobre el reparto. Para saber qué flecha corresponde a cada frase necesitas la **leyenda**, que los guionistas han repartido en cuatro trozos por la sala."
      hotspots:
        - id: pizarra
          kind: puzzle
          type: match
          icon: "📋"
          name: "Pizarra de la trama"
          story: "En la pizarra hay cuatro relaciones dibujadas a toda prisa. Alguien ha tachado las cardinalidades."
          prompt: "¿De qué tipo es cada relación según sus cardinalidades máximas?"
          items:
            - "SERIE **tiene** CAPÍTULO: una serie tiene muchos capítulos; cada capítulo es de una sola serie."
            - "ACTOR **interpreta** PERSONAJE: un actor interpreta varios personajes y un personaje puede interpretarlo más de un actor (de niño y de mayor)."
            - "ACTOR **usa** CAMERINO: durante el rodaje cada actor usa un único camerino y cada camerino lo usa un único actor."
            - "DIRECTOR **dirige** CAPÍTULO: cada capítulo lo dirige una sola persona, que puede dirigir muchos."
          choices: ["1:1", "1:N", "N:M"]
          answer: [1, 2, 0, 1]
          hints:
            - "Haz las dos preguntas: «una instancia de A, ¿con cuántas de B como máximo?» y al revés."
            - "Si las dos respuestas son «muchas», es N:M; si las dos son «una», 1:1; si cada una dice una cosa, 1:N."
          explain: "SERIE–CAPÍTULO y DIRECTOR–CAPÍTULO son **1:N** (el lado N es CAPÍTULO); ACTOR–PERSONAJE es **N:M** y ACTOR–CAMERINO es **1:1**. Para clasificar una relación solo se miran las cardinalidades **máximas**."
          ref: "2.4 Cardinalidades mínima y máxima"
          ref_url: "/ud02-modelo-er/ud02-teoria/#24-restricciones-de-cardinalidad-mínima-y-máxima"
          reward: { icon: "📋", text: "Trozo de leyenda: **→ = (1,1)**" }
        - id: corcho
          kind: puzzle
          type: choice
          icon: "🧵"
          name: "Corcho con hilos rojos"
          story: "En el corcho, fotos de personajes unidas con hilo rojo y una nota: «En la segunda temporada, un personaje puede ser **mentor** de varios personajes, y cada personaje tiene como mucho un mentor»."
          prompt: "¿Cómo se modela la relación MENTORIZA?"
          options:
            - "Binaria entre PERSONAJE y una nueva entidad MENTOR"
            - "Reflexiva (grado 1) 1:N sobre PERSONAJE, con los roles *mentor* y *aprendiz*"
            - "Reflexiva (grado 1) N:M sobre PERSONAJE, sin necesidad de roles"
            - "Un atributo multivaluado `aprendices` en PERSONAJE"
          answer: 1
          hints:
            - "El mentor y el aprendiz son… personajes. ¿Cuántas entidades distintas participan?"
            - "En una relación reflexiva es obligatorio indicar el papel (rol) de cada extremo."
            - "Un mentor tiene muchos aprendices; un aprendiz tiene, como mucho, un mentor."
          explain: "Participa una sola entidad (PERSONAJE) dos veces: es una relación **reflexiva** de grado 1. Como un mentor tiene muchos aprendices y cada aprendiz un mentor como máximo, es **1:N**. Los **nombres de rol** (*mentor*, *aprendiz*) son obligatorios para saber en qué sentido se lee."
          ref: "2.3 Relaciones: grado y roles"
          ref_url: "/ud02-modelo-er/ud02-teoria/#23-relaciones-grado-semántica-y-nombres-de-rol"
          reward: { icon: "🧵", text: "Trozo de leyenda: **← = (0,1)**" }
        - id: archivador
          kind: note
          icon: "🗄️"
          name: "Archivador del guion"
          text: "En el primer cajón está la *biblia* de la serie, con las reglas de reparto que Mara usa en su modelo:"
          list:
            - "En un mismo capítulo, cada personaje lo interpreta **un solo** actor."
            - "En un mismo capítulo, un actor puede interpretar **varios** personajes (los gemelos Ruiz los hace la misma actriz)."
            - "Un actor interpreta al mismo personaje en **muchos** capítulos."
            - "En el fondo del cajón hay un trozo de papel con una flecha dibujada."
          reward: { icon: "🗄️", text: "Trozo de leyenda: **↑ = (0,n)**" }
        - id: portatil
          img: ud02-aparece
          kind: puzzle
          type: choice
          icon: "💻"
          name: "Portátil de Mara"
          story: "El portátil muestra la relación ternaria **APARECE** (ACTOR, PERSONAJE, CAPÍTULO) y pide su conectividad para desbloquearse. Las reglas de reparto están en el archivador."
          table:
            head: ["Si fijas…", "¿cuántos como máximo?"]
            rows: [["un PERSONAJE y un CAPÍTULO", "… ACTORES"], ["un ACTOR y un CAPÍTULO", "… PERSONAJES"], ["un ACTOR y un PERSONAJE", "… CAPÍTULOS"]]
          prompt: "¿Qué conectividad tiene APARECE?"
          options:
            - "N:N:N, sin ninguna restricción"
            - "1:N:N, con ACTOR en el lado «1»"
            - "1:N:N, con PERSONAJE en el lado «1»"
            - "1:1:N, con CAPÍTULO en el lado «N»"
          answer: 1
          hints:
            - "Las reglas del archivador responden a cada una de las tres preguntas de la tabla."
            - "Solo una de las tres preguntas tiene como respuesta «uno»."
            - "Fijados un personaje y un capítulo, solo hay un actor posible: ACTOR es el lado «1»."
          explain: "(PERSONAJE, CAPÍTULO) → como mucho **1** ACTOR; (ACTOR, CAPÍTULO) → **N** personajes; (ACTOR, PERSONAJE) → **N** capítulos. Es una ternaria **1:N:N** con ACTOR en el lado 1. En la UD03 verás que por eso la clave primaria de APARECE será (personaje, capítulo)."
          ref: "4.4 Relaciones ternarias"
          ref_url: "/ud02-modelo-er/ud02-teoria/#44-relaciones-ternarias-y-análisis-formal-de-cardinalidad"
          reward: { icon: "💻", text: "Trozo de leyenda: **↓ = (1,n)**" }
        - id: cafetera
          kind: decoy
          icon: "☕"
          name: "Cafetera"
          text: "Está vacía. Como la inspiración de los guionistas a las tres de la madrugada."
        - id: puerta
          kind: door
          icon: "🚪"
          name: "Puerta de la sala"
          story: "Una cerradura de cuatro flechas. Cada frase pegada en la puerta se completa con un par (mínima, máxima), y cada par corresponde a una flecha de la leyenda."
          list:
            - "Un capítulo pertenece a ___ series."
            - "Una serie tiene ___ capítulos (hay series anunciadas que aún no tienen ningún capítulo rodado)."
            - "Un actor del reparto interpreta ___ personajes (todos interpretan al menos uno)."
            - "Un personaje tiene ___ mentores."
          prompt: "Introduce las cuatro flechas en el orden de las frases."
          lock: { type: arrows, code: "RUDL" }
          hints:
            - "Necesitas los cuatro trozos de la leyenda: pizarra, corcho, archivador y portátil."
            - "Para cada frase pregúntate: ¿puede ser cero? (mínima) ¿puede ser más de uno? (máxima)."
            - "La primera frase es (1,1): →."
          explain: "(1,1) → · (0,n) ↑ · (1,n) ↓ · (0,1) ←. Traducir cada cardinalidad a una frase completa es la mejor forma de no leerla al revés."
    - id: control
      scene: ud02-control
      name: "Control de realización"
      story: "El control de realización está lleno de pantallas encendidas. La salida tiene un **candado de cuatro letras** y, junto a él, una tira de pegatinas: 🔴 🎚️ 📺 🎬."
      hotspots:
        - id: monitores
          kind: puzzle
          type: match
          icon: "📺"
          name: "Pared de monitores"
          story: "Cada pantalla muestra una jerarquía del modelo de la productora, con una nota de Mara."
          prompt: "¿Qué tipo de jerarquía es cada una?"
          items:
            - "Pantalla 1 · PERSONAL → ACTOR, TÉCNICO, GUIONISTA. Hay personal de administración que no es nada de eso, y alguna actriz también escribe guiones."
            - "Pantalla 2 · CAPÍTULO → PILOTO, REGULAR, FINAL_TEMPORADA. Todo capítulo es exactamente de uno de los tres tipos."
            - "Pantalla 3 · CONTRATO → INDEFINIDO, POR_OBRA. Hay contratos de prácticas que no son de ninguno de los dos, y ninguno puede ser de los dos a la vez."
            - "Pantalla 4 · SERIE → TV_ABIERTA, STREAMING. Toda serie se emite en al menos uno de los dos sitios, y muchas en ambos."
          choices: ["Total y disjunta (T, D)", "Total y solapada (T, S)", "Parcial y disjunta (P, D)", "Parcial y solapada (P, S)"]
          answer: [3, 0, 2, 1]
          hints:
            - "Cobertura: ¿puede haber instancias del supertipo que no estén en ningún subtipo? Si es así, es parcial."
            - "Solapamiento: ¿puede una instancia estar en dos subtipos a la vez? Si es así, es solapada."
          explain: "1 → (P, S) · 2 → (T, D) · 3 → (P, D) · 4 → (T, S). Son dos preguntas independientes: **cobertura** (total o parcial) y **solapamiento** (disjunta o solapada)."
          ref: "4.2 Clasificación de jerarquías"
          ref_url: "/ud02-modelo-er/ud02-teoria/#42-clasificación-de-jerarquías-totalparcial-disjuntasolapada"
          reward: { icon: "📺", text: "📺 = **E**" }
        - id: mesa
          kind: puzzle
          type: choice
          icon: "🎚️"
          name: "Mesa de mezclas"
          story: "Pegado en la mesa hay un mensaje del equipo de casting: «Los actores hacen pruebas (CASTING) para personajes. Solo algunas pruebas se graban en vídeo, y cada vídeo grabado lo valora **un** director de casting. Mara, ¿cómo lo metemos en el modelo?»"
          prompt: "¿Cuál es la mejor forma de modelarlo?"
          options:
            - "Una ternaria ACTOR–PERSONAJE–DIRECTOR_CASTING"
            - "Una agregación: CASTING (ACTOR–PERSONAJE) como entidad agregada, relacionada con DIRECTOR_CASTING mediante VALORA, de forma opcional"
            - "Un atributo `director_casting` en ACTOR"
            - "Una jerarquía con DIRECTOR_CASTING como subtipo de ACTOR"
          answer: 1
          hints:
            - "¿Puede existir una prueba de casting que ningún director valore?"
            - "Si la relación entre dos entidades existe sin la tercera, una ternaria obligaría a inventarse un director."
          explain: "Una prueba (ACTOR–PERSONAJE) existe aunque nadie la valore. Con una ternaria, toda prueba necesitaría un director. La **agregación** convierte CASTING en una entidad de orden superior que se relaciona, opcionalmente, con DIRECTOR_CASTING."
          ref: "4.3 Agregación"
          ref_url: "/ud02-modelo-er/ud02-teoria/#43-agregación-modelado-de-asociaciones-como-entidades"
          reward: { icon: "🎚️", text: "🎚️ = **H**" }
        - id: onair
          kind: puzzle
          type: match
          icon: "🔴"
          name: "Luz ON AIR"
          story: "Al pulsar la luz se ilumina un panel con cuatro normas internas del estudio."
          prompt: "¿Qué restricción entre relaciones describe cada norma?"
          items:
            - "Para **dirigir** un capítulo, una persona tiene que haber escrito **el guion de ese mismo capítulo**."
            - "Un técnico puede **manejar cámaras** o **mezclar sonido** en el estudio, pero nunca hace las dos cosas, ni siquiera en capítulos distintos."
            - "Para **dirigir** algún capítulo, una persona tiene que haber **escrito** al menos un guion (de cualquier capítulo)."
            - "Un técnico puede manejar cámaras en un capítulo y mezclar sonido en otro, pero no las dos cosas **en el mismo capítulo**."
          choices: ["Exclusividad", "Exclusión", "Inclusividad", "Inclusión"]
          answer: [3, 0, 2, 1]
          hints:
            - "Las restricciones acabadas en *-idad* hablan de una **instancia** y de las relaciones en las que participa."
            - "Exclusión e inclusión hablan de **parejas** concretas: (técnico, capítulo) o (persona, capítulo)."
          explain: "Exclusividad e inclusividad miran si una instancia participa en una relación u otra; exclusión e inclusión miran **la misma pareja** de instancias en las dos relaciones."
          ref: "3. Restricciones avanzadas"
          ref_url: "/ud02-modelo-er/ud02-teoria/#3-restricciones-avanzadas-sobre-relaciones"
          reward: { icon: "🔴", text: "🔴 = **C**" }
        - id: claqueta
          img: ud02-pata-gallo
          kind: puzzle
          type: choice
          icon: "🎬"
          name: "Claqueta"
          story: "En la claqueta, en lugar del número de escena, alguien ha dibujado la relación SERIE — CAPÍTULO en notación pata de gallo: «toda serie tiene uno o muchos capítulos»."
          prompt: "¿Qué símbolo va junto a CAPÍTULO?"
          options: ["`||`", "`o|`", "`o{`", "`|{`"]
          answer: 3
          hints:
            - "En pata de gallo, el símbolo junto a una entidad dice cuántas instancias **de esa entidad** se asocian con una de la otra."
            - "La raya vertical significa «mínimo uno»; el círculo, «mínimo cero»; la pata de gallo, «muchos»."
          explain: "Junto a CAPÍTULO se dibuja cuántos capítulos tiene una serie: mínimo 1 (`|`) y máximo muchos (`{`), es decir, `|{`. En la notación de Chen sería (1,n)."
          ref: "7.1 Chen y pata de gallo"
          ref_url: "/ud02-modelo-er/ud02-teoria/#71-equivalencia-entre-la-notación-de-chen-y-la-pata-de-gallo"
          reward: { icon: "🎬", text: "🎬 = **N**" }
        - id: pizza
          kind: decoy
          icon: "🍕"
          name: "Caja de pizza"
          text: "Fría y sin ninguna pista dentro. Solo queda un trozo con piña, que nadie del equipo se ha atrevido a tocar."
        - id: puerta
          kind: door
          icon: "🚪"
          name: "Salida"
          story: "Un candado de cuatro letras. Las pegatinas marcan el orden."
          lock: { type: letters, code: "CHEN", order: "🔴 🎚️ 📺 🎬" }
          hints:
            - "Cada reto de esta sala te dio una letra."
            - "La palabra es el apellido del autor del modelo Entidad/Relación (1976)."
          explain: "**C·H·E·N**: Peter Chen publicó el modelo Entidad/Relación en 1976."
  ending:
    title: "¡Has salido del plató!"
    text:
      - "Mara te espera en el aparcamiento con un café (caliente, esta vez): «Si sabes leer un diagrama, ya puedes tocar mi base de datos»."
      - "En la UD03 transformarás este mismo modelo en tablas."
val:
  title: "Talleu! Fugida del plató"
  sub: "Escape room · UD02 Model Entitat/Relació"
  target_min: 35
  intro:
    - "Eres becari o becària d'**Estudis Chen**, la productora que roda la sèrie juvenil *Institut Cardinal*. En acabar la gravació d'esta nit se'n va la llum i el sistema de seguretat bloqueja totes les portes del plató."
    - "Mara, la cap de dades de la productora, va protegir cada pany amb preguntes sobre el model E/R de la sèrie («si no saps llegir un diagrama, no toques la meua base de dades»). Has de travessar el **camerino**, la **sala de guionistes** i el **control de realització** abans que arribe l'equip de demà."
  rooms:
    - id: camerino
      scene: ud02-camerino
      name: "Camerino"
      story: "La porta del camerino té un teclat de tres dígits. Al costat, algú ha apegat tres adhesius: 💄 🪞 👗. La sala fa olor de laca i de pressa."
      hotspots:
        - id: espejo
