# Textos comunes de los juegos (rosco y caza de errores)
es:
  rosco:
    tag: "Rosco"
    rules:
      - "Hay **{n} letras**. Para cada una verás una definición: la respuesta **empieza** por esa letra o la **contiene**."
      - "Escribe la respuesta y pulsa *Intro*. Si no la sabes, pulsa **Pasapalabra** (o *Intro* con la casilla vacía) y volverá a salir al final."
      - "Tienes **{t} segundos**. Las tildes y las mayúsculas no importan."
    best: "Tu mejor marca en este navegador: {ok} de {n} aciertos."
    start: "Empezar"
    answer: "Tu respuesta"
    check: "Responder"
    pass: "Pasapalabra"
    stop: "Plantarse"
    starts: "Empieza por {l}"
    contains: "Contiene la {l}"
    right: "¡Correcto!"
    wrong: "No. Era «{a}»."
    passed: "Pasapalabra."
    end: "Fin del rosco"
    perfect: "¡Rosco completo! 🎉"
    hits: "aciertos"
    misses: "fallos"
    pending: "sin contestar"
    again: "Jugar otra vez"
    c_letter: "Letra"
    c_clue: "Definición"
    c_answer: "Respuesta"
    c_yours: "Tu respuesta"
  caza:
    tag: "Caza de errores"
    goal: "Haz clic en las partes del diagrama que estén **mal**. Hay **{n} errores** escondidos. Si pulsas algo que está bien, te dirá por qué (y contará como fallo)."
    counter: "Encontrados {f}/{n} · Fallos {m}"
    found: "¡Error encontrado!"
    fine: "Esto está bien:"
    already: "Ese error ya lo habías encontrado."
    nothing: "Ahí no hay nada que revisar. Prueba en otro elemento del diagrama."
    hint: "Pista"
    hint_said: "Mira la zona que parpadea."
    solve: "Ver soluciones"
    restart: "Empezar de nuevo"
    win: "¡Has encontrado todos los errores!"
    win_detail: "Fallos: {m} · Pistas: {h}."
    lose: "Has encontrado {f} de {n}. Los que faltaban aparecen marcados en rojo."
    keyboard: "Revisar los elementos sin ratón"
    list_title: "Errores"
val:
  rosco:
    tag: "Rosco"
    rules:
      - "Hi ha **{n} lletres**. Per a cadascuna veuràs una definició: la resposta **comença** per eixa lletra o la **conté**."
      - "Escriu la resposta i prem *Intro*. Si no la saps, prem **Passaparaula** (o *Intro* amb la casella buida) i tornarà a eixir al final."
      - "Tens **{t} segons**. Els accents i les majúscules no importen."
    best: "La teua millor marca en este navegador: {ok} de {n} encerts."
    start: "Començar"
    answer: "La teua resposta"
    check: "Respondre"
    pass: "Passaparaula"
    stop: "Plantar-se"
    starts: "Comença per {l}"
    contains: "Conté la {l}"
    right: "Correcte!"
    wrong: "No. Era «{a}»."
    passed: "Passaparaula."
    end: "Fi del rosco"
    perfect: "Rosco complet! 🎉"
    hits: "encerts"
    misses: "errors"
    pending: "sense contestar"
    again: "Jugar una altra vegada"
    c_letter: "Lletra"
    c_clue: "Definició"
    c_answer: "Resposta"
    c_yours: "La teua resposta"
  caza:
    tag: "Caça d'errors"
    goal: "Fes clic en les parts del diagrama que estiguen **malament**. Hi ha **{n} errors** amagats. Si prems alguna cosa que està bé, et dirà per què (i comptarà com a error)."
    counter: "Trobats {f}/{n} · Errors {m}"
    found: "Error trobat!"
    fine: "Açò està bé:"
    already: "Eixe error ja l'havies trobat."
    nothing: "Ací no hi ha res a revisar. Prova en un altre element del diagrama."
    hint: "Pista"
    hint_said: "Mira la zona que parpelleja."
    solve: "Veure solucions"
    restart: "Tornar a començar"
    win: "Has trobat tots els errors!"
    win_detail: "Errors: {m} · Pistes: {h}."
    lose: "N'has trobat {f} de {n}. Els que faltaven apareixen marcats en roig."
    keyboard: "Revisar els elements sense ratolí"
    list_title: "Errors"
