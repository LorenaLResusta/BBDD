          prompt: "Quin `id_emp` torna?"
          answer: 8
          hints:
            - "Busca en la taula ACCESO de l'expedient."
            - "Només hi ha un accés a Servidores després de les 23:30."
          explain: "Torna el **8**. Per a veure el nom directament caldria compondre amb EMPLEADO: `JOIN empleado e ON e.id_emp = a.id_emp`."
          ref: "3.3 Sintaxi JOIN … ON"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#33-sintaxi-join--on"
          reward: { icon: "📌", text: "Sospitós: `id_emp = 8`" }
        - id: ventana
          kind: decoy
          icon: "🌃"
          name: "Finestra"
          text: "La ciutat dorm. En l'edifici d'enfront algú també està veient una sèrie a estes hores."
        - id: puerta
