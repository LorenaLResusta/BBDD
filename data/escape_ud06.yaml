            - "`AVG` dividix entre els valors **no nuls**; amb `NVL(minutos, 0)` el nul compta com a 0."
          explain: "`AVG(minutos)` = 208 / 4 = **52** (ignora el nul). Amb `NVL` el nul passa a valdre 0: 208 / 5 = 41,6, que s'arredonix a **42**. Triar una o l'altra depén del que signifique el nul."
          ref: "1.6 Errors habituals amb els agregats"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#16-errors-habituals-amb-els-agregats"
          reward: { icon: "⏱️", text: "⏱️ = **42**" }
        - id: pizarra
