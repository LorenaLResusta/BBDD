            - "Dona error: `episodio` apareix en el `SELECT` sense estar en el `GROUP BY` ni dins d'un agregat (ORA-00979)"
            - "Dona error perquè `SUM` no es pot usar amb `GROUP BY`"
            - "Funciona, però només mostra el primer episodi de cada empleat"
          answer: 1
          hints:
            - "Després d'agrupar, cada grup és **una** fila. Quin episodi posaria Oracle en el grup de l'empleat 1, que va veure el 9 i el 10?"
          explain: "Tot el que apareix en el `SELECT` ha d'estar en el `GROUP BY` o dins d'un agregat. Oracle respon **ORA-00979: no és una expressió GROUP BY**. S'arregla amb `GROUP BY id_emp, episodio` o llevant `episodio`."
          ref: "2.2 Què pot aparéixer al SELECT"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#22-què-pot-aparéixer-al-select"
          reward: { icon: "🔓", text: "Panell de la porta desbloquejat" }
