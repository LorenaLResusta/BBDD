          icon: "🚪"
          name: "Porta del despatx"
          needs: [portatil, archivador, cajafuerte, lampara]
          locked: "Abans d'acusar ningú necessites les quatre proves: portàtil, arxivador, caixa forta i làmpada."
          story: "Amb les proves a la mà, el cadenat de lletres espera el **nom** de qui estava en la sala de servidors quan es va usar el compte anònim."
          lock: { type: letters, code: "HUGO" }
          hints:
            - "El suro et dona un `id_emp`; l'expedient, el seu nom."
            - "És l'única persona de Doblaje."
          explain: "**HUGO**, de Doblaje, va entrar en la sala de servidors a les 23:50, es va descarregar el final amb el compte genèric a les 23:55 i el va pujar a les 23:58. Cas tancat."
  ending:
    title: "Cas tancat i tu fora!"
    text:
      - "La direcció de Kairos+ et dona les gràcies: l'estrena continua avant i l'expedient ja està en mans del departament legal."
      - "Has usat `WHERE`, `LIKE`, `NULL`, agregats, `GROUP BY`, `HAVING`, composicions i subconsultes. Amb això ja pots contestar quasi qualsevol pregunta a una base de dades."
