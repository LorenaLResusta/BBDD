        - id: portatil
          kind: puzzle
          type: number
          icon: "💻"
          name: "Portàtil"
          story: "Primera prova: qui va descarregar el capítol final amb el seu propi compte."
          pre: |
            SELECT e.nombre, d.hora
            FROM   empleado e
                   JOIN descarga d ON d.id_emp = e.id_emp
            WHERE  d.episodio = 10;
          prompt: "Quantes files torna?"
          answer: 3
          hints:
            - "Un `JOIN` intern només torna les parelles que complixen la condició `ON`."
            - "La descàrrega amb `id_emp` a `NULL` no té parella en EMPLEADO."
          explain: "Ixen Bruno, Dani i Gala: **3** files. La descàrrega anònima (`id_emp` `NULL`) desapareix del resultat perquè `NULL = qualsevol cosa` mai no és vertader."
          ref: "3. Composicions internes"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#3-composicions-internes-inner-join"
          reward: { icon: "💻", text: "Prova 1: 3 descàrregues amb nom" }
        - id: archivador
          kind: puzzle
          type: number
          icon: "🗄️"
          name: "Arxivador LEFT"
          story: "Segona prova: qui **no** va descarregar res."
          img: ud06-left-join
          img_text: [["todas las filas de e, con o sin pareja en d", "totes les files d'e, amb parella en d o sense"]]
          pre: |
            SELECT e.nombre, COUNT(d.id_desc)
            FROM   empleado e
                   LEFT JOIN descarga d ON d.id_emp = e.id_emp
            GROUP  BY e.nombre
            HAVING COUNT(d.id_desc) = 0;
          prompt: "Quantes files torna?"
          answer: 5
          hints:
            - "`LEFT JOIN` conserva tots els empleats; els que no tenen descàrregues porten `NULL` en les columnes de `d`."
            - "`COUNT(d.id_desc)` no compta els nuls, així que val 0 per a qui no té descàrregues."
          explain: "Bruno, Dani i Gala tenen descàrregues; els altres **5** (Alba, Carla, Elena, Fran i Hugo), no. Amb `COUNT(*)` en lloc de `COUNT(d.id_desc)` tots en tindrien almenys 1 i no n'eixiria cap."
          ref: "4.3 COUNT en una composició externa"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#43-count-en-una-composició-externa-count-enfront-de-countcolumna"
          reward: { icon: "🗄️", text: "Prova 2: 5 sense descàrregues" }
        - id: cajafuerte
          kind: puzzle
          type: number
          icon: "🔒"
          name: "Caixa forta NOT IN"
          story: "Tercera prova: un becari va intentar el mateix que l'arxivador amb una subconsulta… i la caixa forta es va quedar en blanc."
          pre: |
            SELECT nombre
            FROM   empleado
            WHERE  id_emp NOT IN (SELECT id_emp FROM descarga);
          prompt: "Quantes files torna?"
          answer: 0
          hints:
            - "Hi ha algun `NULL` en la llista que torna la subconsulta?"
            - "`x NOT IN (2, 4, 7, NULL)` equival a `x <> 2 AND x <> 4 AND x <> 7 AND x <> NULL`."
          explain: "La subconsulta torna un `NULL` (la descàrrega anònima). `id_emp <> NULL` és desconegut, així que la condició mai no és vertadera: **0** files. És la trampa de `NOT IN` amb nuls; usa `NOT EXISTS` o afig `WHERE id_emp IS NOT NULL` a la subconsulta."
          ref: "6.4 La trampa de NOT IN amb nuls"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#64-la-trampa-de-not-in-amb-nuls"
          reward: { icon: "🔒", text: "Prova 3: compte amb `NOT IN`" }
        - id: lampara
          kind: puzzle
          type: number
          icon: "💡"
          name: "Làmpada AVG"
          story: "Quarta prova: qui cobra per damunt de la mitjana (el filtrador podria haver cobrat pel vídeo… o no)."
          pre: |
            SELECT nombre
            FROM   empleado
            WHERE  salario > (SELECT AVG(salario) FROM empleado);
          prompt: "Quantes files torna?"
          answer: 3
          hints:
            - "Primer calcula la subconsulta: la mitjana dels 8 salaris de la pantalla."
            - "La mitjana és exactament 2100, i la condició és «major que»."
          explain: "La mitjana és 16 800 / 8 = 2100. La superen Carla, Dani i Fran: **3** files (Alba cobra exactament 2100 i no hi entra). És una subconsulta **d'una fila**: torna un sol valor."
          ref: "6.2 Subconsultes d'una fila"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#62-subconsultes-duna-fila"
          reward: { icon: "💡", text: "Prova 4: 3 per damunt de la mitjana" }
        - id: corcho
          kind: puzzle
          type: number
          icon: "📌"
          name: "Suro amb la línia de temps"
          story: "En el suro, l'última consulta: qui va entrar en la sala de servidors després de les 23:30, just abans de la descàrrega anònima de les 23:55."
          pre: |
