          explain: "Les sumes per empleat són 102, 100, 50, 52, 30, 50 i 52. `HAVING SUM(minutos) > 50` deixa els **4** grups del gràfic. Amb `WHERE minutos > 50` es descartarien files abans de sumar i totes les barres valdrien 52; amb `HAVING COUNT(*) > 1` eixirien 1, 2 i 6."
          ref: "2.3 WHERE enfront de HAVING"
          ref_url: "/ud06-consultas/ud06-teoria-avanzada/#23-ordre-davaluació-where-enfront-de-having"
