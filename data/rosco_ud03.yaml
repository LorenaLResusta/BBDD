# Rosco tipo Pasapalabra (shortcode rosco). mode: empieza | contiene; answers: respuestas aceptadas (sin importar tildes ni mayúsculas)
es:
  title: Rosco de la UD03 · Modelo relacional
  intro: Claves, integridad y transformación en una vuelta.
  time: 220
  letters:
  - l: A
    mode: empieza
    clue: 'Clave ___: atributo o conjunto de atributos que referencia la clave primaria de otra tabla.'
    answers:
    - ajena
    ref: 2.3 Clave ajena
    ref_url: /ud03-modelo-relacional/ud03-teoria/#23-clave-foránea--ajena-foreign-key---fk
  - l: B
    mode: empieza
    clue: Las políticas de ___ indican qué ocurre con las filas hijas cuando se elimina la fila padre.
    answers:
    - borrado
    ref: 3.3 Integridad referencial
    ref_url: /ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación
  - l: C
    mode: empieza
    clue: Política por la que, al borrar la fila padre, se borran también automáticamente sus filas hijas.
    answers:
    - cascada
    - en cascada
    ref: 3.3 Políticas de borrado
    ref_url: /ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación
  - l: D
    mode: empieza
    clue: Conjunto de valores válidos que puede tomar un atributo.
    answers:
    - dominio
    ref: 1.2 Dominios
    ref_url: /ud03-modelo-relacional/ud03-teoria/#12-atributos-dominios-grado-y-cardinalidad
  - l: E
    mode: empieza
    clue: Descripción de una relación con su nombre y sus atributos, por ejemplo `CLIENTE(dni, nombre)`.
    answers:
    - esquema
    ref: 1.1 Relación
    ref_url: /ud03-modelo-relacional/ud03-teoria/#11-definición-de-relación-tabla
  - l: F
    mode: empieza
    clue: Otro nombre que recibe la clave ajena, calcado del inglés *foreign key*.
    answers:
    - foránea
    - foranea
    ref: 2.3 Clave ajena
    ref_url: /ud03-modelo-relacional/ud03-teoria/#23-clave-foránea--ajena-foreign-key---fk
  - l: G
    mode: empieza
    clue: Número de atributos (columnas) de una relación.
    answers:
    - grado
    ref: 1.2 Grado y cardinalidad
    ref_url: /ud03-modelo-relacional/ud03-teoria/#12-atributos-dominios-grado-y-cardinalidad
  - l: H
    mode: empieza
    clue: 'Fila ___: la que contiene la clave ajena que apunta a otra fila.'
    answers:
    - hija
    ref: 3.3 Integridad referencial
    ref_url: /ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación
  - l: I
    mode: empieza
    clue: '___ referencial: toda clave ajena debe coincidir con una clave existente o ser nula.'
    answers:
    - integridad
    ref: 3.3 Integridad referencial
    ref_url: /ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación
  - l: J
    mode: empieza
    clue: Al transformarla puedes crear una tabla para el supertipo y una por subtipo, solo las de los subtipos o una única tabla.
    answers:
    - jerarquía
    - jerarquia
    ref: 4.9 Transformación de jerarquías
    ref_url: /ud03-modelo-relacional/ud03-teoria/#49-transformación-de-jerarquías-de-generalización--especialización
  - l: L
    mode: contiene
    clue: 'Clave ___: clave candidata que no se ha elegido como primaria. Se marca con UK.'
    answers:
    - alternativa
    ref: 2.2 Claves alternativas
    ref_url: /ud03-modelo-relacional/ud03-teoria/#22-claves-alternativas
  - l: M
    mode: empieza
    clue: Tipo de atributo que, al transformarse, genera una tabla nueva.
    answers:
    - multivaluado
    ref: 4.3 Atributos multivaluados
    ref_url: /ud03-modelo-relacional/ud03-teoria/#43-transformación-de-atributos-compuestos-y-multivaluados
  - l: N
    mode: empieza
    clue: 'Puesta a ___: política que deja vacía la clave ajena de las filas hijas al borrar la fila padre.'
    answers:
    - nulos
    - 'null'
    ref: 3.3 Políticas de borrado
    ref_url: /ud03-modelo-relacional/ud03-teoria/#33-integridad-referencial-y-políticas-de-borradomodificación
  - l: O
    mode: contiene
    clue: Apellido del investigador de IBM que propuso el modelo relacional en 1970.
    answers:
    - Codd
    ref: 1. Conceptos fundamentales
    ref_url: /ud03-modelo-relacional/ud03-teoria/#1-conceptos-fundamentales-del-modelo-relacional
  - l: P
    mode: empieza
    clue: 'Clave ___: clave candidata elegida para identificar las tuplas de una relación.'
    answers:
    - primaria
    ref: 2.1 Clave primaria
    ref_url: /ud03-modelo-relacional/ud03-teoria/#21-clave-candidata-y-clave-primaria-primary-key---pk
  - l: R
    mode: empieza
    clue: Nombre formal que recibe una tabla en el modelo relacional.
    answers:
    - relación
    - relacion
    ref: 1.1 Relación
    ref_url: /ud03-modelo-relacional/ud03-teoria/#11-definición-de-relación-tabla
  - l: S
    mode: empieza
    clue: Conjunto de atributos que identifica las tuplas, aunque no sea mínimo.
    answers:
    - superclave
    ref: 2.1 Claves
    ref_url: /ud03-modelo-relacional/ud03-teoria/#21-clave-candidata-y-clave-primaria-primary-key---pk
  - l: T
    mode: empieza
    clue: Cada una de las filas de una relación.
    answers:
    - tupla
    ref: 1.3 Tuplas
    ref_url: /ud03-modelo-relacional/ud03-teoria/#13-tuplas-filas-y-semántica-de-valores-nulos-null
  - l: U
    mode: empieza
    clue: Restricción inherente por la que en una relación no puede haber dos tuplas iguales.
    answers:
    - unicidad
    ref: 3.1 Restricciones inherentes
    ref_url: /ud03-modelo-relacional/ud03-teoria/#31-restricciones-inherentes-al-modelo
  - l: V
    mode: empieza
    clue: Sigla que indica en el esquema que un atributo no puede tomar el valor nulo.
    answers:
    - VNN
    ref: 3.2 Restricciones semánticas
    ref_url: /ud03-modelo-relacional/ud03-teoria/#32-restricciones-semánticas-o-de-usuario-pk-uk-obligatoriedad-reglas-de-fila
