<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="820" height="400" rx="12" fill="url(#bgRel)"/>
  <text x="410" y="35" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">El Modelo Relacional: Tablas, Claves Primarias y Foráneas</text>

  <!-- Table 1: SOCIO -->
  <g transform="translate(40, 70)">
    <rect width="330" height="260" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="330" height="40" rx="8" fill="#0284c7"/>
    <text x="165" y="26" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Tabla: SOCIO</text>

    <!-- Header row -->
    <rect x="15" y="50" width="300" height="30" fill="#334155"/>
    <text x="50" y="70" fill="#38bdf8" font-size="12" font-weight="bold">id_socio (PK)</text>
    <text x="150" y="70" fill="#fff" font-size="12" font-weight="bold">nombre</text>
    <text x="240" y="70" fill="#fff" font-size="12" font-weight="bold">email</text>

    <!-- Row 1 -->
    <rect x="15" y="85" width="300" height="30" fill="#0f172a"/>
    <text x="50" y="105" fill="#38bdf8" font-size="12" font-weight="bold">101</text>
    <text x="150" y="105" fill="#e2e8f0" font-size="12">Laura Gómez</text>
    <text x="240" y="105" fill="#94a3b8" font-size="11">laura@mail.com</text>

    <!-- Row 2 -->
    <rect x="15" y="120" width="300" height="30" fill="#1e293b"/>
    <text x="50" y="140" fill="#38bdf8" font-size="12" font-weight="bold">102</text>
    <text x="150" y="140" fill="#e2e8f0" font-size="12">Carlos Ruíz</text>
    <text x="240" y="140" fill="#94a3b8" font-size="11">carlos@mail.com</text>

    <!-- Row 3 -->
    <rect x="15" y="155" width="300" height="30" fill="#0f172a"/>
    <text x="50" y="175" fill="#38bdf8" font-size="12" font-weight="bold">103</text>
    <text x="150" y="175" fill="#e2e8f0" font-size="12">Ana Martínez</text>
    <text x="240" y="175" fill="#94a3b8" font-size="11">ana@mail.com</text>

    <text x="165" y="225" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">🔑 Primary Key (PK): Identificador Único</text>
  </g>

  <!-- Connection Arrow -->
  <path d="M 370 175 C 410 175, 410 175, 450 175" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6" fill="none"/>
  <polygon points="450,170 460,175 450,180" fill="#f59e0b"/>

  <!-- Table 2: PRESTAMO -->
  <g transform="translate(450, 70)">
    <rect width="330" height="260" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="330" height="40" rx="8" fill="#047857"/>
    <text x="165" y="26" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Tabla: PRESTAMO</text>

    <!-- Header row -->
    <rect x="15" y="50" width="300" height="30" fill="#334155"/>
    <text x="45" y="70" fill="#10b981" font-size="12" font-weight="bold">id_prestamo</text>
    <text x="155" y="70" fill="#f59e0b" font-size="12" font-weight="bold">id_socio (FK)</text>
    <text x="250" y="70" fill="#fff" font-size="12" font-weight="bold">fecha</text>

    <!-- Row 1 -->
    <rect x="15" y="85" width="300" height="30" fill="#0f172a"/>
    <text x="45" y="105" fill="#10b981" font-size="12">5001</text>
    <text x="155" y="105" fill="#f59e0b" font-size="12" font-weight="bold">101</text>
    <text x="250" y="105" fill="#94a3b8" font-size="11">2026-10-01</text>

    <!-- Row 2 -->
    <rect x="15" y="120" width="300" height="30" fill="#1e293b"/>
    <text x="45" y="140" fill="#10b981" font-size="12">5002</text>
    <text x="155" y="140" fill="#f59e0b" font-size="12" font-weight="bold">103</text>
    <text x="250" y="140" fill="#94a3b8" font-size="11">2026-10-02</text>

    <!-- Row 3 -->
    <rect x="15" y="155" width="300" height="30" fill="#0f172a"/>
    <text x="45" y="175" fill="#10b981" font-size="12">5003</text>
    <text x="155" y="175" fill="#f59e0b" font-size="12" font-weight="bold">101</text>
    <text x="250" y="175" fill="#94a3b8" font-size="11">2026-10-05</text>

    <text x="165" y="225" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">🔗 Foreign Key (FK): Integridad Referencial</text>
  </g>

  <text x="410" y="365" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">La Clave Foránea (<tspan fill="#f59e0b" font-weight="bold">FK</tspan>) referencia la Clave Primaria (<tspan fill="#38bdf8" font-weight="bold">PK</tspan>) de otra tabla para garantizar la consistencia de datos.</text>
</svg>