<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" rx="12" fill="url(#bgLine)"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Línea del Tiempo: Evolución Histórica de las Bases de Datos</text>

  <!-- Main timeline line -->
  <line x1="50" y1="200" x2="850" y2="200" stroke="#38bdf8" stroke-width="4" stroke-dasharray="0"/>

  <!-- Milestone 1: 1884 -->
  <circle cx="80" cy="200" r="10" fill="#38bdf8"/>
  <line x1="80" y1="200" x2="80" y2="110" stroke="#38bdf8" stroke-width="2"/>
  <rect x="20" y="60" width="120" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="80" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1884</text>
  <text x="80" y="98" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Tarjetas Hollerith</text>

  <!-- Milestone 2: 1950s -->
  <circle cx="210" cy="200" r="10" fill="#10b981"/>
  <line x1="210" y1="200" x2="210" y2="290" stroke="#10b981" stroke-width="2"/>
  <rect x="150" y="290" width="120" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="210" y="310" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Años 50</text>
  <text x="210" y="328" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Cintas Magnéticas</text>

  <!-- Milestone 3: 1960s -->
  <circle cx="340" cy="200" r="10" fill="#f59e0b"/>
  <line x1="340" y1="200" x2="340" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <rect x="275" y="50" width="130" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="70" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Años 60</text>
  <text x="340" y="86" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Discos / CODASYL</text>
  <text x="340" y="100" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Modelo Jerárquico/Red</text>

  <!-- Milestone 4: 1970 -->
  <circle cx="480" cy="200" r="12" fill="#ef4444"/>
  <line x1="480" y1="200" x2="480" y2="290" stroke="#ef4444" stroke-width="2"/>
  <rect x="405" y="290" width="150" height="65" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="310" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1970 - 1972</text>
  <text x="480" y="328" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Modelo Relacional</text>
  <text x="480" y="344" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">E. F. Codd (IBM)</text>

  <!-- Milestone 5: 1976 -->
  <circle cx="610" cy="200" r="10" fill="#8b5cf6"/>
  <line x1="610" y1="200" x2="610" y2="110" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="545" y="55" width="130" height="55" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="610" y="75" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1976</text>
  <text x="610" y="92" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Modelo ER (Peter Chen)</text>

  <!-- Milestone 6: 1980s - Actualidad -->
  <circle cx="780" cy="200" r="10" fill="#ec4899"/>
  <line x1="780" y1="200" x2="780" y2="290" stroke="#ec4899" stroke-width="2"/>
  <rect x="710" y="290" width="140" height="60" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  <text x="780" y="310" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1980s - Actualidad</text>
  <text x="780" y="328" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Estándar SQL &amp; NoSQL</text>
  <text x="780" y="342" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">SGBD Relacionales y Cloud</text>
</svg>